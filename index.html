<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

/* ===== CHARTE GRAPHIQUE CERCLE ===== */
body{background:#f8f7ff}
.reco{border-top:1px solid var(--bd)}
.ld div:first-child{background:var(--p)!important}

/* ===== ANIMATIONS PREMIUM ===== */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}

@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}

/* Classes de stagger pour animations */
.anim-1{animation:fadeSlideUp .5s ease both}
.anim-2{animation:fadeSlideUp .5s .08s ease both}
.anim-3{animation:fadeSlideUp .5s .16s ease both}
.anim-4{animation:fadeSlideUp .5s .24s ease both}

/* Animations utilitaires */

/* Grade card tooltip */

.grade-card-wrap::after{content:'';position:absolute;bottom:100%;left:0;right:0;height:10px;}
.grade-tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:100;border-radius:12px;padding:12px 14px;width:max-content;max-width:190px;background:#fff;}
.grade-card-wrap:hover .grade-tooltip,.grade-card-wrap.tip-open .grade-tooltip{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
/* Respect des préférences d'accessibilité */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
/* Auth modal premium */

.auth-field input,.auth-field select{padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;background:var(--w);color:var(--dk);transition:border-color .2s,box-shadow .2s;outline:none}

}

.msg-time{font-size:10px;opacity:.55;margin-top:4px;display:block;text-align:right}
.msg-time.left{text-align:left}
.msg-day-sep{text-align:center;font-size:11px;color:var(--gl);font-weight:600;margin:10px 0;position:relative}.msg-day-sep::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--bd)}.msg-day-sep span{background:var(--bg);padding:0 12px;position:relative}
.dark .msg-day-sep span{background:#0f0f13}
.chat-typing{display:flex;align-items:center;gap:6px;padding:10px 16px;align-self:flex-start}.chat-typing-av{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px}.chat-typing-dots{display:flex;gap:4px;background:var(--w);padding:10px 14px;border-radius:18px;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.chat-typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--gl);animation:ty .9s infinite}.chat-typing-dots span:nth-child(2){animation-delay:.15s}.chat-typing-dots span:nth-child(3){animation-delay:.3s}@keyframes ty{0%,80%,100%{transform:scale(0.8);opacity:.5}40%{transform:scale(1.1);opacity:1}}
.dark .chat-typing-dots{background:#1e1e2e}
.chat-input-area{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--bd);background:var(--w);display:flex;align-items:flex-end;gap:8px}
.dark .chat-input-area{background:#111118}
.chat-input{flex:1;padding:12px 16px;border:1.5px solid var(--bd);border-radius:24px;font-size:14px;background:var(--bg);color:var(--dk);outline:none;resize:none;max-height:100px;line-height:1.4;font-family:var(--f);transition:border-color .2s}
.chat-input:focus{border-color:var(--p)}
.dark .chat-input{background:#1a1a24;border-color:rgba(255,255,255,.12);color:#F5F5F5}
.chat-send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#5b4fe8,#7c5ce7);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;box-shadow:0 2px 10px rgba(91,79,232,.3)}
.chat-send:hover{transform:scale(1.08);box-shadow:0 4px 18px rgba(91,79,232,.45)}.chat-send:disabled{opacity:.35;transform:none;box-shadow:none}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--g);text-align:center;padding:24px}
.chat-empty-icon{font-size:52px;opacity:.5}
.conv-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:13px;text-align:center;padding:24px}
@media(max-width:768px){
  .conv-list{width:100%;border-right:none;display:flex}
  .conv-list.hidden{display:none}
  .chat-area.hidden{display:none}
  .chat-back-btn{display:flex;align-items:center;justify-content:center}
  .msg-body{position:relative}
}
</style>

</script>

function reducer(s,a){switch(a.type){
  case"LOGIN":{const u={...a.payload,refCode:a.payload.refCode||uid().toUpperCase().slice(0,6)};const fixedItems=s.userItems.map(i=>(!i.owner?.id||i.owner?.email===u.email)?{...i,owner:{...(i.owner||{}),id:u.id,email:u.email}}:i);try{localStorage.setItem('cercle_items',JSON.stringify(fixedItems));}catch(e){}return{...s,user:u,userItems:fixedItems};}
  case"LOGOUT":return{...s,user:null};
  case"UPD_PROF":return{...s,user:{...s.user,...a.payload}};
  case"SET_AVATAR":return{...s,user:{...s.user,avatar:a.avatar,avatarUrl:a.url||null}};
  case"TOG_FAV":{const f=new Set(s.favorites);const isAdding=!f.has(a.id);isAdding?f.add(a.id):f.delete(a.id);if(window.db){const delta=isAdding?1:-1;const inc=window.firebase&&window.firebase.firestore?window.firebase.firestore.FieldValue.increment(delta):null;if(inc)window.db.collection('items').doc(a.id).update({likeCount:inc}).catch(()=>{});}if(isAdding&&window.db&&s.user&&a.ownerId&&a.ownerId!==s.user.id){const notif={userId:a.ownerId,text:`❤️ ${s.user.name||'Quelqu\'un'} a aimé votre annonce "${a.title||''}"`,kind:'like',read:false,at:new Date().toISOString(),itemId:a.id};window.db.collection('notifications').add(notif).catch(()=>{});}return{...s,favorites:f}}
  case"BOOK":{
    const b=a.payload;
    const n={id:uid(),text:`Réservation : ${b.itemTitle}`,read:false,at:new Date()};
    const pay={id:uid(),bookingId:b.id,type:"payment",amount:b.total,status:"completed",method:b.payMethod||"card",date:new Date(),label:`Location : ${b.itemTitle}`};
    const dep={id:uid(),bookingId:b.id,type:"deposit",amount:b.deposit,status:"held",method:b.payMethod||"card",date:new Date(),label:`Caution : ${b.itemTitle}`,itemTitle:b.itemTitle,ownerId:b.ownerId,ownerName:b.ownerName,renterId:b.userId,renterName:s.user?.name||"Locataire"};
    return{...s,bookings:[...s.bookings,b],notifications:[n,...s.notifications],payments:[...s.payments,pay,dep]}}
  case"CANCEL_BOOK":return{...s,bookings:s.bookings.map(b=>b.id===a.id?{...b,status:"cancelled"}:b)};
  case"RELEASE_DEP":{
    const dep=s.payments.find(p=>p.id===a.id);
    const n=dep?{id:uid(),text:`Caution de ${dep.amount}€ restituée (${dep.itemTitle})`,read:false,at:new Date()}:null;
    return{...s,payments:s.payments.map(p=>p.id===a.id?{...p,status:"released",releasedAt:new Date()}:p),notifications:n?[n,...s.notifications]:s.notifications}}
  case"MSG":{const m=a.payload;
    if(s.messages.find(x=>x.id===m.id))return s;
    let cs=[...s.conversations],cv=cs.find(c=>c.id===m.cid);
    const otherName=m.from===s.user?.id?(m.toName||''):( m.fromName||'Utilisateur');
    const otherAvatar=m.from===s.user?.id?(m.toAvatar||'😊'):(m.fromAvatar||'😊');
    if(!cv){cv={id:m.cid,parts:[m.from,m.to],itemId:m.itemId,itemTitle:m.itemTitle||'',last:m.text,at:new Date().toISOString(),otherName,otherAvatar};cs.push(cv)}
    else cs=cs.map(c=>c.id===m.cid?{...c,last:m.text,at:new Date().toISOString()}:c);
    if(window.db&&!m._fromCloud){const msgDoc={...m,_fromCloud:false,sentAt:new Date().toISOString(),timestamp:new Date().toISOString()};window.db.collection('messages').add(msgDoc).catch(e=>console.error('[MSG]',e));}
    if(window.db&&!m._fromCloud&&m.to){const notif={userId:m.to,text:`💬 Nouveau message de ${m.fromName||'quelqu\'un'} sur "${m.itemTitle||'une annonce'}"`,kind:'message',read:false,at:new Date().toISOString(),itemId:m.itemId};window.db.collection('notifications').add(notif).catch(()=>{});}
    return{...s,messages:[...s.messages,m],conversations:cs}}
  case"PUSH_NOTIF":{const n=a.payload;if(s.notifications.find(x=>x.id===n.id))return s;return{...s,notifications:[{...n,read:false},...s.notifications]};}
  case"READ_N":return{...s,notifications:s.notifications.map(n=>({...n,read:true}))};
  case"REVIEW":{const r=a.payload;const items=s.items.map(i=>i.id===r.itemId?{...i,reviews:i.reviews+1,rating:+((i.rating*i.reviews+r.rating)/(i.reviews+1)).toFixed(2)}:i);return{...s,reviews:[...s.reviews,r],items}}
  case"ADD_ITEM":{const owner={...s.user,id:window.firebase&&window.firebase.auth&&window.firebase.auth().currentUser?window.firebase.auth().currentUser.uid:s.user.id};const it={...a.payload,id:uid(),owner,rating:0,reviews:0,createdAt:new Date().toISOString(),isPro:a.payload.isPro||false};const newUserItems=[...s.userItems,it];try{localStorage.setItem('cercle_items',JSON.stringify(newUserItems));}catch(e){console.error('[Cercle] localStorage plein, annonce sauvegardée en mémoire seulement:',e.name);try{const light=newUserItems.map(i=>({...i,images:i.images?.map(im=>im.slice(0,200)+'...'),photos:[]}));localStorage.setItem('cercle_items',JSON.stringify(light));}catch(e2){}}if(window.db){const firestoreItem={...it,images:[],photos:[]};window.db.collection('items').doc(it.id).set(firestoreItem).catch(console.error);}return{...s,userItems:newUserItems,notifications:[{id:uid(),text:`"${it.title}" publiée ! ✅`,read:false,at:new Date()},...s.notifications]}}
  case"READ_ONE":return{...s,notifications:s.notifications.map(n=>n.id===a.id?{...n,read:true}:n)};
  case"REFERRAL":{const n={id:uid(),text:`${a.name} a rejoint Cercle ! +5€`,read:false,at:new Date(),kind:"referral"};return{...s,referrals:[...s.referrals,{id:uid(),name:a.name,date:new Date(),bonus:5}],notifications:[n,...s.notifications]}}
  case"DISPUTE":return{...s,disputes:[...s.disputes,a.payload],notifications:[{id:uid(),text:"Litige ouvert",read:false,at:new Date(),kind:"dispute"},...s.notifications]};
  case"RESOLVE_DISPUTE":return{...s,disputes:s.disputes.map(d=>d.id===a.id?{...d,status:"resolved"}:d)};
  case"VERIFY_ID":return{...s,user:{...s.user,verified:true},notifications:[{id:uid(),text:"Identité vérifiée ✓",read:false,at:new Date(),kind:"system"},...s.notifications]};
  case"ADD_WALLET":return{...s,wallet:s.wallet+(a.amount||0),notifications:[{id:uid(),text:`+${a.amount}€ ajoutés au wallet`,read:false,at:new Date(),kind:"wallet"},...s.notifications]};
  case"PAY_WALLET":return{...s,wallet:Math.max(0,s.wallet-(a.amount||0))};
  case"EARN_BADGE":{if(s.badges.includes(a.badge))return s;const bd=ALL_BADGES.find(b=>b.id===a.badge);const bName=bd?bd.name:a.badge;const bIcon=bd?bd.icon:"🏅";return{...s,badges:[...s.badges,a.badge],notifications:[{id:uid(),text:`🎉 Félicitations ! Badge ${bIcon} "${bName}" débloqué ! Continuez comme ça !`,read:false,at:new Date(),kind:"badge"},...s.notifications]}};
  case"TOGGLE_AVAIL":{const toggle=i=>i.id===a.id?{...i,available:!i.available}:i;return{...s,items:s.items.map(toggle),userItems:s.userItems.map(toggle)}};
  case"SET_PROFILE_COMPLETION":{const pc={...s.profileCompletion,...a.payload};const n={id:uid(),text:`Profil complété : ${a.label||"étape"}`,read:false,at:new Date(),kind:"system"};return{...s,profileCompletion:pc,notifications:[n,...s.notifications]}};
  case"SET_CLOUD_ITEMS":return{...s,cloudItems:a.payload};
  case"FOLLOW":{const f={id:a.userId,name:a.userName,avatar:a.userAvatar,since:a.userSince,followedAt:new Date().toISOString()};const next=[...s.following.filter(u=>u.id!==a.userId),f];try{localStorage.setItem('cercle_following',JSON.stringify(next));}catch(e){}if(window.db&&s.user){const sendFollowNotif=(targetUid)=>{window.db.collection('follows').doc(`${s.user.id}_${targetUid}`).set({followerId:s.user.id,followerName:s.user.name,followerEmail:s.user.email||'',followedId:targetUid,followedEmail:a.ownerEmail||'',followedName:a.userName,at:new Date().toISOString()}).catch(()=>{});window.db.collection('notifications').add({userId:targetUid,text:`👤 ${s.user.name||'Quelqu\'un'} vous suit maintenant`,kind:'follow',read:false,at:new Date().toISOString(),fromId:s.user.id}).catch(()=>{});};if(a.ownerEmail){window.db.collection('users').where('email','==',a.ownerEmail).limit(1).get().then(snap=>{const uid=snap.docs.length>0?snap.docs[0].id:a.userId;sendFollowNotif(uid);}).catch(()=>sendFollowNotif(a.userId));}else{sendFollowNotif(a.userId);}}return{...s,following:next};}
  case"UNFOLLOW":{const next=s.following.filter(u=>u.id!==a.userId);try{localStorage.setItem('cercle_following',JSON.stringify(next));}catch(e){}if(window.db&&s.user){window.db.collection('follows').doc(`${s.user.id}_${a.userId}`).delete().catch(()=>{})}return{...s,following:next};}
  case"EDIT_ITEM":{const upd={...a.payload};const existing=s.userItems.find(i=>i.id===upd.id)||s.items.find(i=>i.id===upd.id)||{};const fullItem={...existing,...upd};const newUserItems=s.userItems.map(i=>i.id===upd.id?fullItem:i);try{localStorage.setItem('cercle_items',JSON.stringify(newUserItems));}catch(e){}if(window.db){const{images,photos,...firestoreItem}=fullItem;window.db.collection('items').doc(upd.id).set(firestoreItem).catch(console.error);}return{...s,userItems:newUserItems,items:s.items.map(i=>i.id===upd.id?fullItem:i)}}
  case"DELETE_ITEM":{const next=s.userItems.filter(i=>i.id!==a.id);try{localStorage.setItem('cercle_items',JSON.stringify(next));}catch(e){}if(window.db){window.db.collection('items').doc(a.id).delete().catch(()=>{})}return{...s,userItems:next,items:s.items.filter(i=>i.id!==a.id)}}
  case"SET_BLOCKED_DATES":{const newUserItems=s.userItems.map(i=>i.id===a.id?{...i,blockedDates:a.dates}:i);try{localStorage.setItem('cercle_items',JSON.stringify(newUserItems));}catch(e){}if(window.db){window.db.collection('items').doc(a.id).update({blockedDates:a.dates}).catch(()=>{})}return{...s,userItems:newUserItems}}
  default:return s}}

function haversine(lat1,lng1,lat2,lng2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function Carousel({images,onClick}){const[c,setC]=useState(0);return <div className="ciw"><img className="cimg" src={images[c]} alt="" loading="lazy" onClick={onClick}/>{images.length>1&&<><button className="nav l" onClick={e=>{e.stopPropagation();setC(x=>(x-1+images.length)%images.length)}}><I.Chv d="l"/></button><button className="nav r" onClick={e=>{e.stopPropagation();setC(x=>(x+1)%images.length)}}><I.Chv d="r"/></button><div className="dts">{images.map((_,i)=><div key={i} className={"dt"+(i===c?" on":"")}/>)}</div></>}</div>}

function Card({item,onOpen,favs,dispatch,onAuthRequired,userLocation}){
  const dist=(userLocation&&LL[item.location])?Math.round(haversine(userLocation.lat,userLocation.lng,LL[item.location][0],LL[item.location][1])):null;

  {item.isPro&&<div className="pro-badge">PRO</div>}
  {item.owner?.verified&&<div className="cbdg">✓</div>}
  {dist!==null&&<div className="card-dist">📍 {dist} km</div>}
  <div className="card-cta">Voir l'annonce →</div>

      <div className="cbp">{item.price} €<span> / jour</span></div>
      <span className="cond-badge">{item.condition}</span>
    </div>
  </div>
</div>}

      <p>L'inscription est gratuite. L'utilisateur s'engage à fournir des informations exactes, sincères et à jour. Il est responsable de la confidentialité de ses identifiants. Cercle se réserve le droit de suspendre ou supprimer tout compte en cas de violation des présentes CGU, d'abus ou de comportement frauduleux.</p>

function AuthModal({onClose,dispatch,mode:im}){
  const[mode,setMode]=useState(im||"login");const[step,setStep]=useState(0);const[acctType,setAcctType]=useState("perso");
  const[f,setF]=useState({firstName:"",lastName:"",dobDay:"",dobMonth:"",dobYear:"",email:"",password:"",city:"",address:"",postalCode:"",phone:"",bio:"",company:"",siret:"",sector:"",tva:"",website:""});
  const[avatarPreview,setAvatarPreview]=useState(null);
  const[addrSugg,setAddrSugg]=useState([]);const addrTimer=React.useRef(null);
  const[cguOk,setCguOk]=useState(false);const[privacyOk,setPrivacyOk]=useState(false);const[marketingOk,setMarketingOk]=useState(false);
  const[showCGU,setShowCGU]=useState(false);const[showPrivacy,setShowPrivacy]=useState(false);
  const[err,setErr]=useState("");const[loading,setLoading]=useState("");
  const u=(k,v)=>setF(p=>({...p,[k]:v}));
  const go=()=>{
    if(mode==="login"){
      if(!f.email||!f.password){setErr("Remplissez tous les champs");return}
      // Firebase Auth ou fallback localStorage
      if(!window.auth){
        // Fallback : vérifier le compte dans localStorage
        try{
          const saved=localStorage.getItem('cercle_user_'+f.email.toLowerCase());
          if(saved){
            const u=JSON.parse(saved);
            if(u._pwd===f.password){
              const {_pwd,...profile}=u;
              dispatch({type:"LOGIN",payload:profile});onClose();
            }else{setErr("Mot de passe incorrect");}
          }else{setErr("Aucun compte trouvé avec cet email. Inscris-toi d'abord.");}
        }catch(e){setErr("Erreur de connexion");}
        return;
      }
      setLoading("login");setErr("");
      window.auth.signInWithEmailAndPassword(f.email,f.password)
        .then(cred=>{
          // Auth réussie — charger le profil Firestore, sans bloquer la connexion si ça échoue
          const uid=cred.user.uid;
          const loadProfile=window.db
            ?window.db.collection('users').doc(uid).get().then(doc=>{
                if(doc&&doc.exists)return doc.data();
                const ls=localStorage.getItem('cercle_user_'+f.email.toLowerCase())||localStorage.getItem('cercle_user_'+f.email);
                if(ls){const{_pwd,...p}=JSON.parse(ls);return{...p,id:uid};}
                return{id:uid,email:cred.user.email,name:cred.user.email.split('@')[0],avatar:'😊',verified:false,since:new Date().getFullYear(),rating:0,rentals:0,responseTime:'~1h',isPro:false};
              }).catch(()=>{
                const ls=localStorage.getItem('cercle_user_'+f.email.toLowerCase())||localStorage.getItem('cercle_user_'+f.email);
                if(ls){const{_pwd,...p}=JSON.parse(ls);return{...p,id:uid};}
                return{id:uid,email:cred.user.email,name:cred.user.email.split('@')[0],avatar:'😊',verified:false,since:new Date().getFullYear(),rating:0,rentals:0,responseTime:'~1h',isPro:false};
              })
            :Promise.resolve({id:uid,email:cred.user.email,name:cred.user.email.split('@')[0],avatar:'😊',verified:false,since:new Date().getFullYear(),rating:0,rentals:0,responseTime:'~1h',isPro:false});
          return loadProfile.then(profile=>{dispatch({type:'LOGIN',payload:profile});});
        })
        .then(()=>{setLoading("");onClose();})
        .catch(e=>{
          setLoading("");
          if(e.code==="auth/user-not-found"||e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/invalid-email"||e.code==="auth/invalid-login-credentials"){
            // Compte localStorage uniquement → fallback
            try{
              const saved=localStorage.getItem('cercle_user_'+f.email.toLowerCase())||localStorage.getItem('cercle_user_'+f.email);
              if(saved){
                const u=JSON.parse(saved);
                if(u._pwd===f.password){
                  const{_pwd,...profile}=u;
                  window.auth.createUserWithEmailAndPassword(f.email,f.password)
                    .then(cred=>{const up={...profile,id:cred.user.uid};if(window.db)window.db.collection('users').doc(cred.user.uid).set(up).catch(()=>{});dispatch({type:'LOGIN',payload:up});})
                    .catch(()=>{dispatch({type:'LOGIN',payload:profile});});
                  onClose();return;
                }else{setErr("Mot de passe incorrect");return;}
              }
            }catch(le){}
            setErr("Email ou mot de passe incorrect");
          }else if(e.code==="auth/network-request-failed"){
            setErr("Pas de connexion internet. Réessaie.");
          }else if(e.code==="auth/too-many-requests"){
            setErr("Trop de tentatives. Réessaie dans quelques minutes.");
          }else{setErr("Erreur de connexion ("+e.code+")");}
        });
    }else{
      if(step===0)return setStep(1);
      if(acctType==="perso"){
        if(!f.firstName||!f.lastName||!f.email||!f.password){setErr("Remplissez tous les champs obligatoires");return}
        if(!cguOk||!privacyOk){setErr("Veuillez accepter les CGU et la Politique de confidentialité");return}
        const dob=f.dobDay&&f.dobMonth&&f.dobYear?`${f.dobDay}/${f.dobMonth}/${f.dobYear}`:"";
        const userData={name:`${f.firstName} ${f.lastName}`,email:f.email,avatar:"😊",verified:false,since:new Date().getFullYear(),bio:f.bio||"",location:f.city||"",city:f.city,address:f.address,postalCode:f.postalCode,phone:f.phone,dob,marketingEmails:marketingOk,avatarUrl:avatarPreview||null,rating:0,rentals:0,responseTime:"~1h",isPro:false};
        if(window.auth){
          setLoading("register");setErr("");
          window.auth.createUserWithEmailAndPassword(f.email,f.password)
            .then(cred=>{
              const u={...userData,id:cred.user.uid};
              if(window.db)window.db.collection('users').doc(cred.user.uid).set(u).catch(()=>{});
              try{localStorage.setItem('cercle_user_'+f.email,JSON.stringify(u));}catch(e){}
              dispatch({type:"LOGIN",payload:u});setLoading("");onClose();
            })
            .catch(e=>{
              setLoading("");
              if(e.code==="auth/email-already-in-use")setErr("Cet email est déjà utilisé. Connecte-toi.");
              else if(e.code==="auth/weak-password")setErr("Mot de passe trop court (6 caractères minimum)");
              else setErr("Erreur lors de la création du compte");
            });
        }else{
          // Fallback localStorage : vérifier si email déjà utilisé
          const existing=localStorage.getItem('cercle_user_'+f.email.toLowerCase());

          const newUser={...userData,id:uid()};
          try{localStorage.setItem('cercle_user_'+f.email.toLowerCase(),JSON.stringify({...newUser,_pwd:f.password}));}catch(e){}
          dispatch({type:"LOGIN",payload:newUser});onClose();
        }
      }else{
        if(!f.company||!f.siret||!f.email||!f.password){setErr("Remplissez les champs obligatoires");return}
        const userData={name:f.company,email:f.email,avatar:"🏢",verified:true,since:new Date().getFullYear(),bio:f.sector?`Secteur : ${f.sector}`:"Professionnel",location:f.city||"",rating:0,rentals:0,responseTime:"~15 min",isPro:true,company:f.company,siret:f.siret,tva:f.tva,phone:f.phone,website:f.website,sector:f.sector};
        if(window.auth){
          setLoading("register");setErr("");
          window.auth.createUserWithEmailAndPassword(f.email,f.password)
            .then(cred=>{
              const u={...userData,id:cred.user.uid};
              if(window.db)window.db.collection('users').doc(cred.user.uid).set(u).catch(()=>{});
              try{localStorage.setItem('cercle_user_'+f.email,JSON.stringify(u));}catch(e){}
              dispatch({type:"LOGIN",payload:u});setLoading("");onClose();
            })
            .catch(e=>{
              setLoading("");
              if(e.code==="auth/email-already-in-use")setErr("Cet email est déjà utilisé. Connecte-toi.");
              else setErr("Erreur lors de la création du compte");
            });
        }else{
          const existing=localStorage.getItem('cercle_user_'+f.email.toLowerCase());
          if(existing){setErr("Cet email est déjà utilisé. Connecte-toi.");return;}
          const newUser={...userData,id:uid()};
          try{localStorage.setItem('cercle_user_'+f.email.toLowerCase(),JSON.stringify({...newUser,_pwd:f.password}));}catch(e){}
          dispatch({type:"LOGIN",payload:newUser});onClose();
        }
      }
    }
  };
  const socialLogin=(provider,name,avatar)=>{
    setLoading(provider);
    setTimeout(()=>{
      dispatch({type:"LOGIN",payload:{id:uid(),name,email:name.toLowerCase().replace(/ /g,".")+"@"+provider+".com",avatar,verified:true,since:2026,bio:"Connecté via "+provider,location:"Paris",rating:0,rentals:0,responseTime:"~30 min",isPro:false}});
      onClose();
    },800);
  };
  const sBtn={width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:"11px 16px",borderRadius:10,fontSize:13,fontWeight:600,border:"1.5px solid var(--bd)",background:"var(--w)",color:"var(--dk)",marginBottom:8,transition:"all .15s",cursor:"pointer",position:"relative"};
  return <><div className="bk" onClick={onClose}><div className="md" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>

function QRModal({item,onClose}){
  const qrRef=useRef(null);
  const baseUrl=window.location.href.split('?')[0];
  const url=`${baseUrl}?annonce=${item.id}&action=confirm`;
  useEffect(()=>{
    if(qrRef.current&&window.QRCode){
      qrRef.current.innerHTML='';
      new QRCode(qrRef.current,{text:url,width:200,height:200,colorDark:"#5b4fe8",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
    }
  },[]);
  const download=()=>{
    const canvas=qrRef.current?.querySelector('canvas');
    if(canvas){const a=document.createElement('a');a.download=`qrcode-${item.title.replace(/\s+/g,'-')}.png`;a.href=canvas.toDataURL('image/png');a.click();}
  };
  return <div className="bk" onClick={onClose}>
    <div className="md" onClick={e=>e.stopPropagation()} style={{maxWidth:420,textAlign:'center'}}>
      <div className="mh"><button className="mx" onClick={onClose}><I.X/></button><h2>📱 QR Code anti-litige</h2></div>

        <div style={{fontSize:13,color:'var(--tx)',lineHeight:1.65,textAlign:'left',background:'#fef9c3',borderRadius:12,padding:'14px 16px',border:'1px solid #fde68a',margin:0,width:'100%'}}>
          📌 Collez ce QR code sur votre objet. Lors de la remise, le locataire devra scanner ce code pour confirmer qu'il a bien reçu l'objet. Au retour, vous devrez scanner ce code pour confirmer la récupération. Cela protège les deux parties en cas de litige.
        </div>
        <button className="bp" style={{width:'100%'}} onClick={download}>⬇️ Télécharger le QR code</button>

/* ===== MINI CALENDAR ===== */
function MiniCal({value,onChange,label,minDate,blockedDates}){
  const d=value?new Date(value):new Date();
  const[viewY,setViewY]=useState(d.getFullYear());const[viewM,setViewM]=useState(d.getMonth());
  const months=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const days=["Lu","Ma","Me","Je","Ve","Sa","Di"];
  const firstDay=new Date(viewY,viewM,1).getDay()||7;
  const daysInMonth=new Date(viewY,viewM+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const minD=minDate?new Date(minDate):today;minD.setHours(0,0,0,0);
  const blockedSet=new Set(blockedDates||[]);
  const prev=()=>{if(viewM===0){setViewM(11);setViewY(viewY-1)}else setViewM(viewM-1)};
  const next=()=>{if(viewM===11){setViewM(0);setViewY(viewY+1)}else setViewM(viewM+1)};
  const selDate=value?new Date(value):null;if(selDate)selDate.setHours(0,0,0,0);
  const cells=[];for(let i=1;i<firstDay;i++)cells.push(null);for(let i=1;i<=daysInMonth;i++)cells.push(i);
  return <div style={{background:"var(--w)",borderRadius:12,border:"1.5px solid var(--bd)",overflow:"hidden"}}>
    <div style={{padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--bgw)"}}>
      <button style={{background:"none",border:"none",fontSize:16,cursor:"pointer",padding:"2px 8px",borderRadius:6}} onClick={prev}>‹</button>
      <span style={{fontSize:13,fontWeight:700,fontFamily:"var(--fd)"}}>{months[viewM]} {viewY}</span>
      <button style={{background:"none",border:"none",fontSize:16,cursor:"pointer",padding:"2px 8px",borderRadius:6}} onClick={next}>›</button>
    </div>
    <div style={{padding:"6px 8px"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>{days.map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"var(--gl)",padding:2}}>{d}</div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {cells.map((day,i)=>{if(!day)return <div key={i}/>;
          const dt=new Date(viewY,viewM,day);dt.setHours(0,0,0,0);
          const key=`${viewY}-${String(viewM+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const isBlocked=blockedSet.has(key);
          const isPast=dt<minD;const isSel=selDate&&dt.getTime()===selDate.getTime();const isToday=dt.getTime()===today.getTime();
          const disabled=isPast||isBlocked;
          return <button key={i} disabled={disabled} onClick={()=>{if(disabled)return;const m=String(viewM+1).padStart(2,"0");const dd=String(day).padStart(2,"0");onChange(`${viewY}-${m}-${dd}`)}}
            title={isBlocked?"Indisponible":undefined}
            style={{width:"100%",aspectRatio:"1",border:isBlocked?"1.5px solid #fecaca":"none",borderRadius:8,fontSize:12,fontWeight:isSel?700:isToday?600:400,
              background:isSel?"var(--p)":isBlocked?"#fee2e2":isToday?"var(--bgw)":"transparent",
              color:isSel?"#fff":isBlocked?"#ef4444":isPast?"var(--gl)":"var(--dk)",
              cursor:disabled?"default":"pointer",transition:"all .1s",textDecoration:isBlocked?"line-through":"none"}}>
            {day}
          </button>
        })}
      </div>
    </div>
    {blockedDates&&blockedDates.length>0&&<div style={{padding:"4px 12px",fontSize:10,color:"#ef4444",display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:2,background:"#fee2e2",border:"1px solid #fca5a5",display:"inline-block"}}/>Jours indisponibles</div>}
    {label&&<div style={{padding:"6px 12px",borderTop:"1px solid var(--bd)",fontSize:11,color:"var(--g)",textAlign:"center"}}>{label}: <strong>{value||"—"}</strong></div>}
  </div>
}

function DetailMap({item}){
  const mapRef=useRef(null);
  const leafletRef=useRef(null);
  const[coords,setCoords]=useState(null);
  const[loading,setLoading]=useState(true);
  const[mapsUrl,setMapsUrl]=useState("#");

  useEffect(()=>{
    // 1. Coordonnées directes sur l'item
    if(item.lat&&item.lng&&!(item.lat===48.86&&item.lng===2.35)){
      setCoords({lat:item.lat,lng:item.lng});setLoading(false);
      setMapsUrl(`https://www.openstreetmap.org/?mlat=${item.lat}&mlon=${item.lng}#map=14/${item.lat}/${item.lng}`);
      return;
    }
    // 2. Table LL pour les villes connues
    const known=LL[item.location];
    if(known){
      setCoords({lat:known[0],lng:known[1]});setLoading(false);
      setMapsUrl(`https://www.openstreetmap.org/?mlat=${known[0]}&mlon=${known[1]}#map=14/${known[0]}/${known[1]}`);
      return;
    }
    // 3. Geocoding Nominatim pour toute autre adresse (Hambach 57910, etc.)
    setLoading(true);
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(item.location)}&format=json&limit=1&accept-language=fr`,{headers:{"Accept-Language":"fr"}})
      .then(r=>r.json())
      .then(data=>{
        if(data&&data[0]){
          const lat=parseFloat(data[0].lat),lng=parseFloat(data[0].lon);
          setCoords({lat,lng});
          setMapsUrl(`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=14/${lat}/${lng}`);
        }else{setCoords(null);}
        setLoading(false);
      })
      .catch(()=>{setCoords(null);setLoading(false);});
  },[item.id,item.location]);

  useEffect(()=>{
    if(!coords||!mapRef.current||!window.L)return;
    // Nettoyer la carte précédente
    if(leafletRef.current){leafletRef.current.remove();leafletRef.current=null;}
    const map=window.L.map(mapRef.current,{zoomControl:true,scrollWheelZoom:false,attributionControl:false})
      .setView([coords.lat,coords.lng],14);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    const icon=window.L.divIcon({
      html:`<div style="width:36px;height:36px;background:linear-gradient(135deg,#5b4fe8,#F59E0B);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 12px rgba(91,79,232,.4)"></div>`,
      className:"",iconSize:[36,36],iconAnchor:[18,36]
    });
    window.L.marker([coords.lat,coords.lng],{icon})
      .addTo(map)
      .bindPopup(`<strong style="font-size:13px">${item.location}</strong><br><span style="font-size:11px;color:#767676">Zone approximative</span>`,{closeButton:false})
      .openPopup();
    leafletRef.current=map;
    return()=>{if(leafletRef.current){leafletRef.current.remove();leafletRef.current=null;}};
  },[coords]);

  return <div style={{marginBottom:24}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
      <h3 style={{fontSize:15,fontWeight:700,fontFamily:"var(--fd)"}}>📍 Localisation</h3>
      {!loading&&coords&&<a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"var(--p)",fontWeight:600,textDecoration:"none"}}>Ouvrir dans Maps ↗</a>}
    </div>
    <p style={{fontSize:12,color:"var(--g)",marginBottom:10}}>Zone approximative · <strong>{item.location}</strong> · adresse exacte après réservation</p>
    <div style={{borderRadius:16,overflow:"hidden",border:"1px solid var(--bd)",boxShadow:"var(--sh)",height:240,background:"var(--bgw)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      {loading&&<div style={{fontSize:13,color:"var(--g)"}}>🗺️ Chargement de la carte...</div>}
      {!loading&&!coords&&<div style={{fontSize:13,color:"var(--g)",textAlign:"center"}}><div style={{fontSize:32,marginBottom:8}}>📍</div>Localisation : <strong>{item.location}</strong></div>}
      <div ref={mapRef} style={{width:"100%",height:"100%",display:coords&&!loading?"block":"none"}}/>
    </div>
  </div>;
}

];
function getGrade(rentals) { return GRADES.find(g => rentals >= g.min && rentals <= g.max) || GRADES[0]; }
function getNextGrade(rentals) { const i = GRADES.findIndex(g => rentals >= g.min && rentals <= g.max); return i < GRADES.length - 1 ? GRADES[i + 1] : null; }
function getDivision(rentals) {
  const g = getGrade(rentals);
  const div = g.divs.find(d => rentals >= d.min && rentals <= d.max) || g.divs[0];
  const nextDiv = g.divs[g.divs.findIndex(d => rentals >= d.min && rentals <= d.max) + 1] || null;
  const prog = nextDiv ? Math.min(100, Math.round(((rentals - div.min) / (nextDiv.min - div.min)) * 100)) : 100;
  return { div, nextDiv, prog };
}
function calcSavings(rentals, avgPrice) {
  const base = GRADES[0].feeRate;
  const current = getGrade(rentals).feeRate;
  return Math.floor(rentals * avgPrice * 3 * (base - current));
}

function CalendarModal({item, dispatch, onClose}) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [month, setMonth] = React.useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [blocked, setBlocked] = React.useState(new Set(item.blockedDates||[]));
  const daysInMonth = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const firstDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
  const startOffset = (firstDay + 6) % 7;
  const monthLabel = month.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  function toggleDay(d) {
    const key = `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    setBlocked(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }
  function save() {
    dispatch({type:'SET_BLOCKED_DATES', id:item.id, dates:[...blocked]});
    onClose();
  }
  const days=['Lu','Ma','Me','Je','Ve','Sa','Di'];
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'var(--w)',borderRadius:20,padding:24,width:340,maxWidth:'95vw',boxShadow:'0 20px 60px rgba(0,0,0,0.25)'}}>
        <h3 style={{margin:'0 0 4px',fontSize:16,fontWeight:700,color:'var(--dk)'}}>📅 Disponibilités</h3>
        <p style={{margin:'0 0 16px',fontSize:12,color:'var(--g)'}}>Touchez les jours pour les bloquer / débloquer</p>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <button onClick={()=>setMonth(new Date(month.getFullYear(),month.getMonth()-1,1))} style={{border:'none',background:'none',fontSize:18,cursor:'pointer',color:'var(--dk)'}}>‹</button>
          <span style={{fontWeight:700,fontSize:14,color:'var(--dk)',textTransform:'capitalize'}}>{monthLabel}</span>
          <button onClick={()=>setMonth(new Date(month.getFullYear(),month.getMonth()+1,1))} style={{border:'none',background:'none',fontSize:18,cursor:'pointer',color:'var(--dk)'}}>›</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:12}}>
          {days.map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:700,color:'var(--g)',padding:'2px 0'}}>{d}</div>)}
          {Array.from({length:startOffset}).map((_,i)=><div key={'e'+i}/>)}
          {Array.from({length:daysInMonth}).map((_,i)=>{
            const d=i+1;
            const key=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const date=new Date(month.getFullYear(),month.getMonth(),d);
            const isPast=date<today;
            const isBlocked=blocked.has(key);
            return (
              <div key={d} onClick={()=>!isPast&&toggleDay(d)} style={{textAlign:'center',padding:'6px 2px',borderRadius:8,fontSize:12,fontWeight:600,cursor:isPast?'default':'pointer',background:isBlocked?'#ef4444':isPast?'transparent':'#f0fdf4',color:isBlocked?'#fff':isPast?'#d1d5db':'var(--dk)',opacity:isPast?0.4:1}}>
                {d}
              </div>
            );
          })}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--g)'}}><div style={{width:12,height:12,borderRadius:3,background:'#ef4444'}}/>Bloqué</div>

          <button onClick={()=>setTab("parametres")} style={{padding:"10px 18px",borderRadius:10,border:"1.5px solid var(--bd)",background:"var(--w)",color:"var(--dk)",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",gap:6}}>✏️ Modifier</button>
        </div>
        {/* Pills row */}
        {(user.verified||user.superHost||(user.city||user.location)||profileData.bio)&&
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:14,paddingTop:14,borderTop:"1px solid var(--bd)"}}>
            {profileData.bio&&<span style={{fontSize:12,color:"var(--g)",flex:"0 0 100%",marginBottom:4,lineHeight:1.5}}>{profileData.bio}</span>}
            <span style={S.pill}>⚡ Répond en &lt;1h</span>
            <span style={S.pill}>🔒 Paiement sécurisé</span>
            <span style={S.pill}>🛡️ Caution assurée</span>
          </div>}
      </div>

      {/* ─── TABS ─── */}
      <div style={{display:"flex",gap:2,background:"var(--w)",borderRadius:14,border:"1px solid var(--bd)",padding:"4px",marginBottom:20,flexWrap:"wrap",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:"9px 14px",borderRadius:10,border:"none",
            background:tab===t.id?"var(--bgw)":"transparent",
            color:tab===t.id?"var(--p)":"var(--g)",
            fontWeight:tab===t.id?700:500,fontSize:12,cursor:"pointer",outline:"none",
            display:"flex",alignItems:"center",gap:5,transition:"all .15s",fontFamily:"var(--f)"
          }}>
            <span>{t.icon}</span><span>{t.label}</span>
            {t.count!==null&&<span style={{fontSize:10,fontWeight:700,background:tab===t.id?"rgba(91,79,232,0.12)":"var(--bg)",color:tab===t.id?"var(--p)":"var(--gl)",borderRadius:8,padding:"1px 6px"}}>{t.count}</span>}
          </button>
        ))}
      </div>

      {/* ─── CONTENT ─── */}
      <div key={tab} style={{animation:"fadeSlideUp 0.35s cubic-bezier(0.34,1.56,0.64,1) both"}}>

        {/* ── Annonces ── */}
        {tab === 'annonces' && (()=>{
          const annoFilters=["Toutes","Actives","En pause","Brouillons"];
          const filteredListings=displayListings.filter(l=>{
            if(annoFilter==="Toutes")return true;
            const st=l.status||"available";
            if(annoFilter==="Actives")return st==="available"||st==="active";
            if(annoFilter==="En pause")return st==="rented"||st==="paused";
            if(annoFilter==="Brouillons")return st==="draft"||st==="maintenance";
            return true;
          });
          const activeCount=displayListings.filter(l=>!l.status||l.status==="available"||l.status==="active").length;
          const totalRevenue=state.bookings.filter(b=>(b.ownerId===user.id)&&b.status==="confirmed").reduce((s,b)=>s+b.total,0);
          const totalLocs=state.bookings.filter(b=>b.ownerId===user.id&&b.status==="confirmed").length;
          const noteGlob=displayListings.length>0&&displayListings.some(l=>l.rating>0)?(displayListings.reduce((s,l)=>s+l.rating,0)/displayListings.length).toFixed(1):"4,9";
          return <div>
            {/* Page header */}
            <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:20,gap:12,flexWrap:"wrap"}}>
              <div>
                <div style={{fontFamily:"var(--fd)",fontSize:22,fontWeight:700,color:"var(--dk)"}}>Mes annonces</div>
                <div style={{fontSize:12,color:"var(--g)",marginTop:3}}>Gérez vos objets en location</div>
              </div>
              <button onClick={()=>setPage("create")} style={{padding:"11px 20px",background:"var(--p)",color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:7,boxShadow:"0 4px 14px rgba(91,79,232,.3)"}}>+ Nouvelle annonce</button>
            </div>
            {/* 4 stat cards */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}} className="dboard-grid">
              {[
                {val:activeCount,lbl:"Annonces actives",icon:"🏷️"},
                {val:totalLocs,lbl:"Locations total",icon:"📦"},
                {val:totalRevenue+"€",lbl:"Revenus",icon:"💰"},
                {val:noteGlob+"★",lbl:"Note globale",icon:"⭐"},
              ].map((s,i)=>(
                <div key={i} style={{background:"var(--w)",borderRadius:14,border:"1px solid var(--bd)",padding:"16px 18px",boxShadow:"0 2px 12px rgba(15,10,71,.06)"}}>
                  <div style={{fontSize:20,marginBottom:8}}>{s.icon}</div>
                  <div style={{fontSize:22,fontWeight:800,color:"var(--dk)",letterSpacing:"-.02em"}}>{s.val}</div>
                  <div style={{fontSize:11,color:"var(--g)",marginTop:3}}>{s.lbl}</div>
                </div>
              ))}
            </div>
            {/* Filter pills */}
            <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
              {annoFilters.map(f=><button key={f} onClick={()=>setAnnoFilter(f)} style={{padding:"7px 16px",borderRadius:20,border:"none",background:annoFilter===f?"var(--p)":"#f5f2ff",color:annoFilter===f?"#fff":"var(--p)",fontSize:12,fontWeight:annoFilter===f?700:500,cursor:"pointer",transition:"all .15s"}}>{f}</button>)}
            </div>
            {filteredListings.length===0?(
              <div style={{textAlign:"center",padding:"60px 20px",background:"var(--w)",borderRadius:16,border:"2px dashed var(--bd)"}}>
                <div style={{fontSize:44,marginBottom:12}}>🏷️</div>
                <p style={{fontWeight:700,color:"var(--dk)",fontSize:15,marginBottom:4}}>Aucune annonce pour l'instant</p>
                <p style={{fontSize:13,color:"var(--g)"}}>Publie ta première annonce pour commencer à louer !</p>
              </div>
            ):(
              <div style={{background:"var(--w)",borderRadius:16,border:"1px solid var(--bd)",overflow:"hidden",boxShadow:"0 4px 20px rgba(15,10,71,.05)"}}>
                <div style={{display:"grid",gridTemplateColumns:"60px 1fr 90px 90px 80px 110px 140px",padding:"10px 16px",background:"var(--bg)",borderBottom:"1px solid var(--bd)"}}>
                  {["","Annonce","Catégorie","Prix/j","Locations","Note","Statut","Actions"].slice(0,7).map((h,i)=>(
                    <div key={i} style={{fontSize:10,fontWeight:700,color:"var(--g)",textTransform:"uppercase",letterSpacing:".06em"}}>{h}</div>
                  ))}
                </div>
                {filteredListings.map((l,i)=>{
                  const stat=l.status||"available";
                  const isActive=!stat||stat==="available"||stat==="active";
                  const isPaused=stat==="rented"||stat==="paused";
                  const statusLabel=isActive?"Active":isPaused?"En pause":"Brouillon";
                  const statusColor=isActive?"#1a994d":isPaused?"#d13838":"#D97706";
                  const statusBg=isActive?"#e5ffeb":isPaused?"#fff2f2":"#FEF3C7";
                  const locs=state.bookings.filter(b=>b.itemId===l.id&&b.status==="confirmed").length;
                  return (
                    <div key={l.id} style={{display:"grid",gridTemplateColumns:"60px 1fr 90px 90px 80px 110px 140px",padding:"14px 16px",borderBottom:i<filteredListings.length-1?"1px solid var(--bd)":"none",alignItems:"center",transition:"background .15s"}}
                      onMouseEnter={e=>e.currentTarget.style.background="var(--bg)"}
                      onMouseLeave={e=>e.currentTarget.style.background=""}>
                      <div style={{width:48,height:48,borderRadius:10,overflow:"hidden",background:"var(--bgw)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0,cursor:"pointer"}} onClick={()=>setSelected&&setSelected(l)}>
                        {l.images&&l.images[0]?<img src={l.images[0]} alt={l.title} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:(l.img||"📦")}
                      </div>
                      <div style={{paddingRight:8,cursor:"pointer"}} onClick={()=>setSelected&&setSelected(l)}>
                        <div style={{fontSize:13,fontWeight:700,color:"var(--dk)",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.title}</div>
                        <div style={{fontSize:11,color:"var(--g)"}}>{l.reviews||0} avis{(l.likeCount||0)>0?` · ❤️ ${l.likeCount}`:""}</div>
                      </div>
                      <div style={{fontSize:11,color:"var(--g)"}}>{CATS_FR[l.cat]||l.cat}</div>
                      <div style={{fontSize:14,fontWeight:800,color:"var(--p)"}}>{l.price}€</div>
                      <div style={{fontSize:13,fontWeight:600,color:"var(--dk)"}}>{locs}</div>
                      <div style={{fontSize:12,color:"#F59E0B",fontWeight:700}}>{"★".repeat(Math.round(l.rating||0))} {l.rating||"—"}</div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{background:statusBg,color:statusColor,borderRadius:20,padding:"4px 10px",fontSize:10,fontWeight:700}}>{statusLabel}</span>
                      </div>
                    </div>
                  );
                })}
                {/* Actions row merged - shown below status */}
              </div>
            )}
            {/* Actions row for each item */}
            {filteredListings.length>0&&<div style={{marginTop:12,display:"flex",flexDirection:"column",gap:6}}>
              {filteredListings.map((l,i)=>(
                <div key={l.id+"_act"} style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6,padding:"4px 0"}}>
                  <button onClick={()=>onEditItem&&onEditItem(l)} style={{height:32,padding:"0 12px",border:"1px solid var(--bd)",borderRadius:8,background:"var(--bg)",cursor:"pointer",fontSize:12,fontWeight:600,color:"var(--p)"}}>Éditer</button>
                  <button onClick={()=>setCalItem(l)} style={{width:32,height:32,border:"1px solid var(--bd)",borderRadius:8,background:"var(--w)",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>📅</button>
                  <button onClick={()=>setQrItem(l)} style={{width:32,height:32,border:"1px solid var(--bd)",borderRadius:8,background:"var(--w)",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>📱</button>
                  {deleteConfirm===l.id
                    ?<><button onClick={()=>{dispatch({type:"DELETE_ITEM",id:l.id});setDeleteConfirm(null);}} style={{height:32,padding:"0 12px",border:"none",borderRadius:8,background:"#ef4444",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:700}}>✓</button>
                      <button onClick={()=>setDeleteConfirm(null)} style={{width:32,height:32,border:"1px solid var(--bd)",borderRadius:8,background:"var(--w)",cursor:"pointer",fontSize:11,fontWeight:700}}>✕</button></>
                    :<button onClick={()=>setDeleteConfirm(l.id)} style={{width:32,height:32,border:"1px solid #fecaca",borderRadius:8,background:"#fff1f2",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>🗑️</button>
                  }
                </div>
              ))}
            </div>}
          </div>;
        })()}
        {qrItem&&<QRModal item={qrItem} onClose={()=>setQrItem(null)}/>}
        {calItem&&<CalendarModal item={calItem} dispatch={dispatch} onClose={()=>setCalItem(null)}/>}

        {/* ── Mon Parc (Pro only) ── */}
        {tab === 'parc' && (
          <div>
            <p style={{fontSize:13,color:'var(--g)',margin:'0 0 16px',fontWeight:500}}>{myProItems.length} équipement{myProItems.length!==1?'s':''} dans votre parc professionnel</p>
            {myProItems.length === 0 ? (
              <div style={{textAlign:'center',padding:'48px 20px',color:'#9ca3af'}}>
                <div style={{fontSize:44,marginBottom:12}}>🏗️</div>
                <p style={{fontWeight:700,color:'#374151',fontSize:15,marginBottom:4}}>Aucun équipement Pro</p>
                <p style={{fontSize:13}}>Publiez une annonce en mode Professionnel pour l'ajouter ici.</p>
              </div>
            ) : (
              <div style={S.listingGrid}>
                {myProItems.map((l, i) => (
                  <div key={l.id} className="prof-listing-card" style={{...S.card,border:'2px solid #2563EB22',animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:`${i*0.07}s`}} onClick={() => { setSelected && setSelected(l); }}>
                    <div style={{...S.listingImg,background:'linear-gradient(135deg,#dbeafe,#eff6ff)'}}>
                      {l.images&&l.images[0]?<img src={l.images[0]} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:(l.img||'🏗️')}
                    </div>
                    <div style={S.listingBody}>
                      <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:4}}>
                        <span style={{fontSize:9,fontWeight:700,color:'#2563EB',background:'#dbeafe',padding:'2px 6px',borderRadius:4}}>PRO</span>
                      </div>
                      <p style={S.listingTitle}>{l.title}</p>
                      <p style={S.listingPrice}>{l.price}€<span style={{fontWeight:400,fontSize:11,color:'var(--g)'}}>/jour</span></p>
                      <div style={S.listingRating}>⭐ {l.rating||'—'} <span>· {l.reviews||0} avis</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ── Réservations ── */}
        {tab === 'reservations' && (()=>{
          const now=Date.now();
          const allBookings=state.bookings.filter(b=>b.userId===user.id||b.ownerId===user.id);
          const catColors=['#f5a623','#3d85f5','#1ab885','#993de5','#e5453d','#0bb8a9'];
          function bookingStatus(b){
            if(b.status==='cancelled') return 'annulee';
            const s=b.startDate?new Date(b.startDate).getTime():0;
            const e=b.endDate?new Date(b.endDate).getTime():0;
            if(now>=s&&now<=e) return 'en_cours';
            if(now<s) return 'a_venir';
            return 'terminee';
          }
          const counts={tout:allBookings.length,en_cours:allBookings.filter(b=>bookingStatus(b)==='en_cours').length,a_venir:allBookings.filter(b=>bookingStatus(b)==='a_venir').length,terminee:allBookings.filter(b=>bookingStatus(b)==='terminee').length};
          const filtered=resFilter==='tout'?allBookings:allBookings.filter(b=>bookingStatus(b)===resFilter);
          const TABS=[{id:'tout',label:`Tout (${counts.tout})`},{id:'en_cours',label:`En cours (${counts.en_cours})`},{id:'a_venir',label:`À venir (${counts.a_venir})`},{id:'terminee',label:`Terminées (${counts.terminee})`}];
          return <div>
            {/* Title */}
            <div style={{marginBottom:20}}>
              <div style={{fontFamily:"var(--fd)",fontSize:26,fontWeight:700,color:"var(--dk)"}}>Réservations</div>
              <div style={{fontSize:13,color:"var(--g)",marginTop:4}}>Gérez vos locations en cours et à venir</div>
            </div>
            {/* Filter tabs */}
            <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
              {TABS.map(t=>(
                <button key={t.id} onClick={()=>setResFilter(t.id)} style={{padding:"8px 18px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:resFilter===t.id?"var(--p)":"var(--w)",color:resFilter===t.id?"#fff":"var(--g)",boxShadow:resFilter===t.id?"0 2px 8px rgba(91,79,232,.3)":"0 1px 4px rgba(0,0,0,0.06)",transition:"all .2s"}}>{t.label}</button>
              ))}
            </div>
            {filtered.length===0?
              <div style={{textAlign:"center",padding:"60px 0",background:"var(--w)",borderRadius:16,border:"2px dashed var(--bd)"}}>
                <span style={{fontSize:40}}>📅</span>
                <p style={{fontWeight:700,color:"var(--dk)",fontSize:15,marginTop:12}}>Aucune réservation</p>
              </div>:
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {filtered.map((b,i)=>{
                const bStatus=bookingStatus(b);
                const isOwner=b.ownerId===user.id;
                const personName=isOwner?(b.renterName||b.ownerName||"?"):(b.ownerName||"?");
                const s=b.startDate?new Date(b.startDate).getTime():now-86400000;
                const e=b.endDate?new Date(b.endDate).getTime():now+86400000;
                const totalDuration=e-s;
                const elapsed=Math.max(0,Math.min(1,(now-s)/totalDuration));
                const pct=Math.round(elapsed*100);
                const days=b.startDate&&b.endDate?Math.max(1,Math.ceil((e-s)/86400000)):1;
                const caution=b.caution||(b.total?b.total*2:null);
                const colorIdx=Math.abs((b.itemTitle||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0))%catColors.length;
                const thumbBg=catColors[colorIdx];
                const statusMap={en_cours:{label:"En cours",color:"#059669",bg:"#d1fae5"},a_venir:{label:"À venir",color:"#2563eb",bg:"#dbeafe"},terminee:{label:"Terminée",color:"#6b7280",bg:"#f3f4f6"},annulee:{label:"Annulée",color:"#ef4444",bg:"#fee2e2"}};
                const si=statusMap[bStatus]||statusMap.a_venir;
                return (
                  <div key={b.id} style={{background:"var(--w)",borderRadius:16,border:"1px solid var(--bd)",padding:"18px 20px",boxShadow:"0 2px 12px rgba(15,10,71,.05)",display:"flex",gap:16,alignItems:"center",animation:`fadeSlideIn 0.4s ${i*0.06}s both`}}>
                    {/* Thumbnail */}
                    <div style={{width:72,height:72,borderRadius:14,background:thumbBg,overflow:"hidden",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>
                      {b.itemImg?<img src={b.itemImg} alt={b.itemTitle} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:(b.itemEmoji||"📦")}
                    </div>
                    {/* Main info */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:700,color:"var(--dk)",marginBottom:2}}>{b.itemTitle||"Article"}</div>
                      <div style={{fontSize:12,color:"var(--g)",marginBottom:6}}>{isOwner?"Loué par":"Loué par"} {personName} · 📅 {b.startDate||"—"} – {b.endDate||"—"} · {days} jour{days!==1?"s":""}</div>
                      {bStatus==='en_cours'&&<div>
                        <div style={{height:5,background:"var(--bgw)",borderRadius:3,overflow:"hidden",marginBottom:4}}>
                          <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,var(--p),#7c5ce7)",borderRadius:3,transition:"width 0.8s ease"}}/>
                        </div>
                        <div style={{fontSize:11,color:"var(--g)"}}>{pct}% complété</div>
                      </div>}
                    </div>
                    {/* Right: price + status + actions */}
                    <div style={{flexShrink:0,textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                      <div style={{fontSize:20,fontWeight:800,color:"var(--dk)"}}>{b.total||"—"}€</div>
                      {caution&&<div style={{fontSize:11,color:"var(--g)"}}>Caution : {caution}€</div>}
                      <span style={{background:si.bg,color:si.color,borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:700,display:"inline-block"}}>{si.label}</span>
                      <div style={{display:"flex",gap:6,marginTop:2}}>
                        <button onClick={()=>onMessage&&onMessage(isOwner?b.userId:b.ownerId)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid var(--bd)",background:"var(--w)",color:"var(--tx)",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>💬 Contacter</button>
                        {bStatus==='terminee'&&<button onClick={()=>onReview&&onReview(b)} style={{padding:"5px 12px",borderRadius:8,border:"none",background:"#fef3c7",color:"#92400e",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>⭐ Laisser avis</button>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>}
          </div>;
        })()}

        {/* ── Avis ── */}
        {tab === 'avis' && (
          <div>
            {/* Page title */}
            <div style={{marginBottom:20}}>
              <div style={{fontFamily:"var(--fd)",fontSize:26,fontWeight:700,color:"var(--dk)"}}>Mes avis</div>
              <div style={{fontSize:13,color:"var(--g)",marginTop:4}}>Votre réputation sur la plateforme</div>
            </div>
            {reviewCount===0?
              <div style={{textAlign:"center",padding:"60px 0",background:"var(--w)",borderRadius:16,border:"2px dashed var(--bd)"}}>
                <span style={{fontSize:44}}>⭐</span>
                <p style={{fontWeight:700,color:"var(--dk)",fontSize:16,marginTop:12}}>Aucun avis pour l'instant</p>
                <p style={{fontSize:13,color:"var(--g)",marginTop:4}}>Tes premiers avis apparaîtront ici après tes locations.</p>
              </div>:
            <>
            {/* 4 KPI cards */}
            {(()=>{
              const lastRating=state.reviews.length>0?state.reviews[state.reviews.length-1].rating:null;
              const replyCount=state.reviews.filter(r=>r.reply).length;
              const replyPct=reviewCount>0?Math.round(replyCount/reviewCount*100):0;
              return <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:20}}>
                <div style={{background:"var(--w)",borderRadius:16,padding:"20px",border:"1px solid var(--bd)",boxShadow:"0 4px 20px rgba(15,10,71,.05)",borderLeft:"4px solid #F59E0B"}}>
                  <div style={{fontSize:10,color:"var(--g)",fontWeight:700,marginBottom:4,textTransform:"uppercase",letterSpacing:".06em"}}>Note moyenne</div>
                  <div style={{fontSize:32,fontWeight:800,color:"var(--dk)",letterSpacing:"-.02em",lineHeight:1.1}}>{avgRating}</div>
                  <div style={{fontSize:14,color:"#F59E0B",marginTop:6,letterSpacing:1}}>{"★".repeat(Math.round(parseFloat(avgRating)||0))}{"☆".repeat(5-Math.round(parseFloat(avgRating)||0))}</div>
                </div>
                <div style={{background:"var(--w)",borderRadius:16,padding:"20px",border:"1px solid var(--bd)",boxShadow:"0 4px 20px rgba(15,10,71,.05)",borderLeft:"4px solid var(--p)"}}>
                  <div style={{fontSize:10,color:"var(--g)",fontWeight:700,marginBottom:4,textTransform:"uppercase",letterSpacing:".06em"}}>Avis reçus</div>
                  <div style={{fontSize:32,fontWeight:800,color:"var(--dk)",letterSpacing:"-.02em",lineHeight:1.1}}>{reviewCount}</div>
                  <div style={{fontSize:12,color:"var(--g)",marginTop:6}}>évaluations</div>
                </div>
                <div style={{background:"var(--w)",borderRadius:16,padding:"20px",border:"1px solid var(--bd)",boxShadow:"0 4px 20px rgba(15,10,71,.05)",borderLeft:"4px solid #10b981"}}>
                  <div style={{fontSize:10,color:"var(--g)",fontWeight:700,marginBottom:4,textTransform:"uppercase",letterSpacing:".06em"}}>Réponses</div>
                  <div style={{fontSize:32,fontWeight:800,color:"var(--dk)",letterSpacing:"-.02em",lineHeight:1.1}}>{replyPct}%</div>
                  <div style={{fontSize:12,color:"#10b981",marginTop:6}}>taux de réponse</div>
                </div>
                <div style={{background:"var(--w)",borderRadius:16,padding:"20px",border:"1px solid var(--bd)",boxShadow:"0 4px 20px rgba(15,10,71,.05)",borderLeft:"4px solid #f59e0b"}}>
                  <div style={{fontSize:10,color:"var(--g)",fontWeight:700,marginBottom:4,textTransform:"uppercase",letterSpacing:".06em"}}>Dernière note</div>
                  <div style={{fontSize:32,fontWeight:800,color:"var(--dk)",letterSpacing:"-.02em",lineHeight:1.1}}>{lastRating?lastRating+"★":"—"}</div>
                  <div style={{fontSize:12,color:"var(--g)",marginTop:6}}>dernier avis reçu</div>
                </div>
              </div>;
            })()}
            {/* Rating distribution */}
            <div style={{background:"var(--w)",borderRadius:20,padding:"20px 24px",border:"1px solid var(--bd)",boxShadow:"0 1px 8px rgba(0,0,0,0.06)",marginBottom:20}}>
              <div style={{fontSize:13,fontWeight:700,color:"var(--dk)",marginBottom:14}}>Répartition des notes</div>
              {[5,4,3,2,1].map(n=>{
                const cnt=state.reviews.filter(r=>Math.round(r.rating)===n).length;
                const pct=reviewCount>0?Math.round(cnt/reviewCount*100):0;
                return <div key={n} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <span style={{fontSize:12,color:"var(--g)",width:16,textAlign:"right",flexShrink:0}}>{n}★</span>
                  <div style={{flex:1,height:6,background:"var(--bgw)",borderRadius:3,overflow:"hidden"}}>
                    <div style={{width:`${pct}%`,height:"100%",background:"#f59e0b",borderRadius:3,transition:"width 1s ease"}}/>
                  </div>
                  <span style={{fontSize:11,color:"#9ca3af",width:20,textAlign:"right"}}>{cnt}</span>
                </div>;
              })}
            </div>
            {/* Review cards */}
            {(()=>{const colors=["#8b5cf6","#3b82f6","#10b981","#f59e0b","#06b6d4"];return state.reviews.map((r,i)=>{
              const initials=(r.fromUserName||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
              const dateStr=r.createdAt?new Date(r.createdAt).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
              return <div key={r.id} style={{...S.reviewCard,animation:"scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both",animationDelay:`${i*0.08}s`}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:10}}>
                  <div style={S.reviewAvatar(colors[i%colors.length])}>{initials}</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                      <div>
                        <span style={S.reviewName}>{r.fromUserName}</span>
                        {r.itemTitle&&<div style={{fontSize:11,color:"var(--g)",marginTop:1}}>{r.itemTitle}</div>}
                      </div>
                      <span style={{fontSize:11,color:"var(--g)",flexShrink:0,marginLeft:8}}>{dateStr}</span>
                    </div>
                    <div style={{marginTop:4,letterSpacing:1}}>{Array.from({length:r.rating||0}).map((_,si)=><span key={si} style={{color:"#f59e0b",fontSize:13}}>★</span>)}{Array.from({length:Math.max(0,5-(r.rating||0))}).map((_,si)=><span key={si} style={{color:"#e5e7eb",fontSize:13}}>★</span>)}</div>
                  </div>
                </div>
                <p style={S.reviewText}>"{r.text}"</p>
              </div>;
            });})()}
          </>}
          </div>
        )}

        {/* ── Abonnements ── */}
        {tab === 'abonnements' && (
          <div>
            <p style={{fontSize:13,color:'var(--g)',margin:'0 0 16px',fontWeight:500}}>{(state.following||[]).length} abonnement{(state.following||[]).length!==1?'s':''}</p>
            {(state.following||[]).length===0
              ? <div style={{textAlign:'center',padding:'40px 0'}}><span style={{fontSize:40}}>👥</span><p style={{fontWeight:700,color:'#374151',fontSize:15,marginTop:12}}>Aucun abonnement</p><p style={{fontSize:13,color:'#9ca3af',marginTop:4}}>Suivez des propriétaires depuis leurs annonces.</p></div>
              : (state.following||[]).map((f,i)=>(
                <div key={f.id} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',background:'var(--w)',borderRadius:16,border:'1px solid var(--bd)',marginBottom:10,boxShadow:'0 1px 6px rgba(0,0,0,0.05)',animation:'fadeSlideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:`${i*0.07}s`}}>
                  <div style={{width:48,height:48,borderRadius:'50%',background:'linear-gradient(135deg,#ede9fe,#ddd6fe)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0}}>{f.avatar||'👤'}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14,color:'var(--dk)'}}>{f.name}</div>
                    {f.since&&<div style={{fontSize:11,color:'var(--g)',marginTop:2}}>Membre depuis {f.since}</div>}
                  </div>
                  <button onClick={()=>dispatch({type:'UNFOLLOW',userId:f.id})} style={{padding:'6px 14px',borderRadius:20,border:'1.5px solid #e5e7eb',background:'var(--bg)',color:'var(--g)',fontSize:11,fontWeight:700,cursor:'pointer'}}>Se désabonner</button>
                </div>
              ))
            }
          </div>
        )}

        {/* ── Favoris ── */}
        {tab === 'favoris' && (()=>{
          const FAV_CATS=[{id:'tous',label:'Tous'},{id:'bricolage',label:'Bricolage'},{id:'electronique',label:'Électronique'},{id:'vehicules',label:'Véhicules'},{id:'sport',label:'Sport'}];
          const CAT_COLORS=['#f5a623','#3d85f5','#1ab885','#993de5','#e5453d','#0bb8a9','#f59e0b','#6366f1'];
          const displayItems=favFilter==='tous'?favItems:favItems.filter(f=>(f.cat||'').toLowerCase()===favFilter||(CATS_FR&&CATS_FR[f.cat]||'').toLowerCase()===favFilter);
          return <div>
            {/* Title */}
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <div style={{fontFamily:"var(--fd)",fontSize:26,fontWeight:700,color:"var(--dk)"}}>Mes favoris</div>
              <span style={{background:"var(--p)",color:"#fff",borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:700}}>{favItems.length}</span>
              <div style={{fontSize:13,color:"var(--g)",marginLeft:4}}>Les objets que vous avez sauvegardés</div>
            </div>
            {/* Category filter pills */}
            <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
              {FAV_CATS.map(c=>(
                <button key={c.id} onClick={()=>setFavFilter(c.id)} style={{padding:"7px 18px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:favFilter===c.id?"var(--p)":"var(--w)",color:favFilter===c.id?"#fff":"var(--tx)",boxShadow:favFilter===c.id?"0 2px 8px rgba(91,79,232,.3)":"0 1px 4px rgba(0,0,0,0.06)",transition:"all .2s"}}>{c.label}</button>
              ))}
            </div>
            {displayItems.length === 0 ? (
              <div style={{textAlign:"center",padding:"60px 20px",background:"var(--w)",borderRadius:16,border:"2px dashed var(--bd)"}}>
                <div style={{fontSize:44,marginBottom:12}}>❤️</div>
                <p style={{fontWeight:700,color:"var(--dk)",fontSize:15,marginBottom:4}}>Aucun favori {favFilter!=='tous'?'dans cette catégorie':''}</p>
                <p style={{fontSize:13,color:"var(--g)"}}>Likez des annonces pour les retrouver ici</p>
              </div>
            ) : (
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16}}>
                {displayItems.map((f,i)=>{
                  const colorIdx=Math.abs((f.title||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0))%CAT_COLORS.length;
                  const cardColor=CAT_COLORS[colorIdx];
                  return (
                    <div key={f.id} className="prof-fav-card" style={{background:"var(--w)",borderRadius:16,border:"1px solid var(--bd)",boxShadow:"0 2px 12px rgba(15,10,71,.05)",overflow:"hidden",transition:"transform .2s,box-shadow .2s",animation:`fadeSlideUp 0.4s ${i*0.06}s both`}}

/* ===== CHATBOT ===== */
function Chatbot({items,onOpen,onClose}){
  const[msgs,setMsgs]=useState([{from:"bot",text:"Bonjour ! 👋 Je suis l'assistant Cercle.\n\nDites-moi ce que vous cherchez à louer !\n\nExemples :\n• \"perceuse\" ou \"bricolage\"\n• \"vélo\" ou \"transport\"\n• \"fête\" ou \"anniversaire\"\n• \"prix\" pour les moins chers\n• \"aide\" pour comprendre le fonctionnement"}]);
  const[input,setInput]=useState("");const ref=useRef(null);
  useEffect(()=>{ref.current&&(ref.current.scrollTop=ref.current.scrollHeight)},[msgs.length]);
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const KW={tools:["bricolage","perceuse","visseuse","ponceuse","echelle","nettoyeur","karcher","outil","percer","poncer","scie","tournevis","marteau","cle","compresseur","meuleuse"],electronics:["electronique","drone","console","ps5","xbox","projecteur","videoprojecteur","enceinte","jbl","bluetooth","tv","ecran","son","haut-parleur","camera"],vehicles:["vehicule","voiture","camion","camionnette","velo","trottinette","scooter","remorque","transport","utilitaire","fourgon","moto"],sports:["sport","paddle","ski","kayak","vtt","velo","surf","planche","raquette","fitness","musculation","boxe","randonnee","escalade"],garden:["jardin","tondeuse","taille-haie","taille haie","motoculteur","arrosage","plante","herbe","pelouse","haie","debroussailleuse","souffleur"],events:["evenement","fete","mariage","anniversaire","chaise","tonnelle","barbe a papa","sono","dj","decoration","party","bapteme","reception"],music:["musique","guitare","piano","platine","dj","instrument","clavier","batterie","micro","ampli","synthetiseur"],gaming:["jeu","gaming","console","casque vr","meta quest","volant","manette","ps5","xbox","nintendo","playstation","jeux video"],baby:["bebe","poussette","siege auto","enfant","landau","berceau","biberon","puericulture"],fashion:["mode","robe","costume","vetement","habit","sezane","hugo boss","tenue","smoking"],camping:["camping","tente","glaciere","sac de couchage","randonnee","bivouac","plein air","hamac","rechaud"],kitchen:["cuisine","robot","kitchenaid","raclette","fondue","patissier","mixer","blender","thermomix","plancha"],photo:["photo","appareil","camera","canon","stabilisateur","trepied","objectif","reflex","video","gopro","nikon","sony"],diy:["creatif","couture","coudre","imprimante 3d","singer","machine","impression","diy","art","broder"]};
  const findItems=(q)=>{
    const words=norm(q).split(/\s+/).filter(w=>w.length>1);
    if(words.length===0)return[];
    let scored=items.map(item=>{let score=0;const t=norm(item.title);const d=norm(item.description||"");const c=item.cat;
      words.forEach(w=>{
        if(t.includes(w))score+=10;
        if(w.length>=3&&t.split(/\s+/).some(tw=>tw.startsWith(w)||w.startsWith(tw)))score+=6;
        if(d.includes(w))score+=3;
        if(c.includes(w))score+=5;
        Object.entries(KW).forEach(([cat,kws])=>{if(kws.some(k=>k.includes(w)||w.includes(k)||(w.length>=3&&k.startsWith(w)))){if(item.cat===cat)score+=8}})
      });
      return{item,score}}).filter(s=>s.score>0).sort((a,b)=>b.score-a.score);
    return scored.slice(0,4).map(s=>s.item);
  };
  const getCatFromQ=(q)=>{const ql=norm(q);let best=null,bestN=0;Object.entries(KW).forEach(([cat,kws])=>{const n=kws.filter(k=>ql.includes(k)||(k.length>=3&&ql.split(/\s+/).some(w=>k.includes(w)||w.includes(k)))).length;if(n>bestN){bestN=n;best=cat}});return best};
  const send=()=>{if(!input.trim())return;const q=input.trim();const ql=norm(q);setMsgs(p=>[...p,{from:"user",text:q}]);setInput("");
    setTimeout(()=>{
      if(["bonjour","salut","hello","hi","hey","coucou","yo"].some(g=>ql.includes(g))){setMsgs(p=>[...p,{from:"bot",text:"Bonjour ! 😊 Comment puis-je vous aider ?\n\nDites-moi ce que vous voulez louer, par exemple :\n\"perceuse\", \"vélo\", \"sono pour une fête\"..."}]);return}
      if(["merci","thanks","super","genial","parfait","cool"].some(g=>ql.includes(g))){setMsgs(p=>[...p,{from:"bot",text:"Avec plaisir ! 😊 N'hésitez pas si vous avez d'autres questions."}]);return}
      if(["prix","combien","budget","cher","pas cher","moins cher","economique","cheap"].some(g=>ql.includes(g))){const sorted=[...items].sort((a,b)=>a.price-b.price);setMsgs(p=>[...p,{from:"bot",text:`💰 Les prix vont de ${sorted[0]?.price}€ à ${sorted[sorted.length-1]?.price}€ par jour.\n\nVoici les plus abordables :`,items:sorted.slice(0,4)}]);return}
      if(["caution","depot","garantie","remboursement","rembourse"].some(g=>ql.includes(g))){setMsgs(p=>[...p,{from:"bot",text:"🔒 Caution\n\nLa caution est bloquée lors de la réservation et restituée sous 48h après le retour de l'objet en bon état.\n\nLe propriétaire la libère depuis son espace."}]);return}
      if(["aide","comment","fonctionn","utiliser","marche","expliqu"].some(g=>ql.includes(g))){setMsgs(p=>[...p,{from:"bot",text:"📖 Comment ça marche ?\n\n1️⃣ Trouvez un objet à louer\n2️⃣ Réservez et payez en ligne (paiement sécurisé)\n3️⃣ Récupérez l'objet chez le propriétaire\n4️⃣ Profitez-en pendant la durée !\n5️⃣ Rendez-le → caution restituée 🎉\n\nBesoin d'autre chose ?"}]);return}
      if(["populaire","tendance","top","meilleur","mieux note"].some(g=>ql.includes(g))){const top=[...items].sort((a,b)=>b.rating-a.rating).slice(0,4);setMsgs(p=>[...p,{from:"bot",text:"🔥 Top annonces les mieux notées :",items:top}]);return}
      if(["nouveau","recent","dernier","neuf"].some(g=>ql.includes(g))){const recent=items.filter(i=>i.condition==="Comme neuf").slice(0,4);setMsgs(p=>[...p,{from:"bot",text:"✨ Objets en état \"Comme neuf\" :",items:recent.length>0?recent:items.slice(0,4)}]);return}
      const found=findItems(q);
      if(found.length>0){setMsgs(p=>[...p,{from:"bot",text:`J'ai trouvé ${found.length} résultat${found.length>1?"s":""} pour "${q}" 🎯`,items:found}])}
      else{const cat=getCatFromQ(q);
        if(cat){const catItems=items.filter(i=>i.cat===cat).slice(0,4);if(catItems.length>0){setMsgs(p=>[...p,{from:"bot",text:`Dans la catégorie ${CATS.find(c=>c.id===cat)?.label||cat} :`,items:catItems}])}else{setMsgs(p=>[...p,{from:"bot",text:`Hmm, rien trouvé dans cette catégorie. Essayez d'autres mots-clés !`}])}}
        else{const suggestions=items.sort(()=>Math.random()-.5).slice(0,3);setMsgs(p=>[...p,{from:"bot",text:`Je n'ai pas trouvé de résultat pour "${q}" 😅\n\nEssayez avec :\n• Un nom d'objet : perceuse, vélo, drone\n• Une catégorie : bricolage, sport, musique\n• Un mot-clé : fête, photo, camping\n\nVoici quelques suggestions :`,items:suggestions}])}}
    },400+Math.random()*200)};
  return <div className="chatbot-w">
    <div className="chatbot-hd"><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:20}}>🤖</span><div><div style={{fontWeight:700,fontSize:14}}>Assistant Cercle</div><div style={{fontSize:10,opacity:.8}}>En ligne · Réponse instantanée</div></div></div><button style={{background:"none",border:"none",color:"#fff",fontSize:18,cursor:"pointer"}} onClick={onClose}>✕</button></div>
    <div className="chatbot-bd" ref={ref}>{msgs.map((m,i)=><div key={i}><div className={"chatbot-msg "+(m.from)} style={{whiteSpace:"pre-line"}}>{m.text}</div>
      {m.items&&<div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>{m.items.map(it=><div key={it.id} style={{display:"flex",gap:8,padding:8,background:"var(--bg)",borderRadius:12,cursor:"pointer",fontSize:12,transition:"all .15s",border:"1px solid var(--bd)"}} onClick={()=>onOpen(it)} onMouseEnter={e=>{e.currentTarget.style.transform="scale(1.02)";e.currentTarget.style.borderColor="var(--p)"}} onMouseLeave={e=>{e.currentTarget.style.transform="scale(1)";e.currentTarget.style.borderColor="var(--bd)"}}><img src={it.images[0]} alt="" style={{width:48,height:36,objectFit:"cover",borderRadius:8,flexShrink:0}}/><div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.title}</div><div style={{display:"flex",justifyContent:"space-between",marginTop:2}}><span style={{color:"var(--p)",fontWeight:700}}>{it.price}€/j</span><span style={{color:"var(--g)"}}>★ {it.rating}</span></div></div></div>)}</div>}
    </div>)}</div>
    <div className="chatbot-ft"><input value={input} onChange={e=>setInput(e.target.value)} placeholder="Que cherchez-vous à louer ?" onKeyDown={e=>e.key==="Enter"&&send()}/><button onClick={send}><I.Send/></button></div>
  </div>
}

function ReservationsPage({state,dispatch,setPage}){

  const catColors=['#f5a623','#3d85f5','#1ab885','#993de5','#e5453d','#0bb8a9'];
  function bookingStatus(b){
    if(b.status==='cancelled') return 'annulee';
    const s=b.startDate?new Date(b.startDate).getTime():0;
    const e=b.endDate?new Date(b.endDate).getTime():0;
    if(now>=s&&now<=e) return 'en_cours';
    if(now<s) return 'a_venir';
    return 'terminee';
  }
  const counts={tout:allBookings.length,en_cours:allBookings.filter(b=>bookingStatus(b)==='en_cours').length,a_venir:allBookings.filter(b=>bookingStatus(b)==='a_venir').length,terminee:allBookings.filter(b=>bookingStatus(b)==='terminee').length};
  const filtered=resFilter==='tout'?allBookings:allBookings.filter(b=>bookingStatus(b)===resFilter);
  const TABS=[{id:'tout',label:`Tout (${counts.tout})`},{id:'en_cours',label:`En cours (${counts.en_cours})`},{id:'a_venir',label:`À venir (${counts.a_venir})`},{id:'terminee',label:`Terminées (${counts.terminee})`}];

        <div style={{display:"flex",flexDirection:"column",gap:12}}>

            const bStatus=bookingStatus(b);
            const isOwner=b.ownerId===user.id;
            const personName=isOwner?(b.renterName||b.userName||"?"):(b.ownerName||"?");
            const s=b.startDate?new Date(b.startDate).getTime():now-86400000;
            const e=b.endDate?new Date(b.endDate).getTime():now+86400000;
            const elapsed=Math.max(0,Math.min(1,(now-s)/(e-s)));
            const pct=Math.round(elapsed*100);
            const days=b.startDate&&b.endDate?Math.max(1,Math.ceil((e-s)/86400000)):1;
            const caution=b.caution||(b.total?b.total*2:null);
            const colorIdx=Math.abs((b.itemTitle||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0))%catColors.length;

                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function AvisPage({state}){

  const replyPct=reviewCount>0?Math.round(replyCount/reviewCount*100):0;
  const lastRating=myRevs.length>0?myRevs[myRevs.length-1].rating:null;

                  </div>

                <p style={{fontSize:13,color:"var(--g)",lineHeight:1.65,margin:0}}>"{r.text}"</p>
              </div>;
            })}

      )}

  );

  useEffect(()=>{document.documentElement.classList.toggle('dark',dark);document.body.style.background=dark?'#0f0f13':''},[dark]);
  const[mode,setMode]=useState('perso'); // 'perso' or 'pro'
  const[listingTab,setListingTab]=useState('particuliers'); // 'particuliers' or 'professionnels'
  const[showChat,setShowChat]=useState(false);

  const[infoPage,setInfoPage]=useState(null);
  const goInfo=(id)=>{setInfoPage(id);setPage("info");window.scrollTo(0,0);};
  const[pushNotif,setPushNotif]=useState(null);
  const[openSection,setOpenSection]=useState(null);
  const toggleSection=(name)=>setOpenSection(prev=>prev===name?null:name);
  const[lang,setLang]=useState('fr');
  const[filters,setFilters]=useState({priceMin:0,priceMax:500,condition:"Tous",options:[],sort:"pertinence",filterCat:"all",minRating:0,searchDate:"",userLocation:null,maxDistance:20});

  const allPerso=useMemo(()=>{const seen=new Set();return[...state.items,...state.userItems,...state.cloudItems].filter(i=>{if(i.isPro||i.owner?.isPro)return false;if(seen.has(i.id))return false;seen.add(i.id);return true;});},[state.items,state.userItems,state.cloudItems]);
  const allPro=useMemo(()=>{const seen=new Set();return[...state.proItems,...state.userItems.filter(i=>i.isPro||i.owner?.isPro),...state.cloudItems.filter(i=>i.isPro||i.owner?.isPro)].filter(i=>{if(seen.has(i.id))return false;seen.add(i.id);return true;});},[state.proItems,state.userItems,state.cloudItems]);
  const all=mode==='pro'?allPro:(listingTab==='professionnels'?allPro:allPerso);
  const unread=state.notifications.filter(n=>!n.read).length;

  const filtered=useMemo(()=>{
    let r=all;
    if(cat!=="all")r=r.filter(i=>i.cat===cat);
    if(filters.filterCat&&filters.filterCat!=="all")r=r.filter(i=>i.cat===filters.filterCat);
    if(filters.searchDate)r=r.filter(i=>i.available!==false);
    if(q){const s=q.toLowerCase();r=r.filter(i=>i.title.toLowerCase().includes(s)||i.cat.includes(s)||i.location.toLowerCase().includes(s))}
    if(lq){const s=lq.toLowerCase();r=r.filter(i=>i.location.toLowerCase().includes(s))}
    r=r.filter(i=>i.price>=filters.priceMin&&i.price<=filters.priceMax);
    if(filters.condition!=="Tous")r=r.filter(i=>i.condition===filters.condition);
    if(filters.minRating>0)r=r.filter(i=>i.rating>=filters.minRating);

    // Filtre proximité
    if(filters.userLocation&&filters.maxDistance>0){const{lat,lng}=filters.userLocation;r=r.filter(i=>{const c=LL[i.location];if(!c)return true;return haversine(lat,lng,c[0],c[1])<=filters.maxDistance;});}
    // Sort
    if(filters.sort==="price_asc")r=[...r].sort((a,b)=>a.price-b.price);

            color:listingTab==='particuliers'?"var(--dk)":"var(--g)",
            boxShadow:listingTab==='particuliers'?"var(--sh)":"none"}}>👤 Particuliers</button>
          <button onClick={()=>setListingTab('professionnels')} style={{padding:"8px 18px",borderRadius:24,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s",
            background:listingTab==='professionnels'?"linear-gradient(135deg,#1E3A5F,#2563EB)":"transparent",
            color:listingTab==='professionnels'?"#fff":"var(--g)",
            boxShadow:listingTab==='professionnels'?"0 2px 8px rgba(37,99,235,.25)":"none"}}>🏢 Professionnels</button>
        </div>
      </div>}
      {filtered.length===0?<div className="empty"><span>🔍</span><h2>Aucun résultat trouvé</h2><p style={{maxWidth:320,margin:"6px auto 16px",lineHeight:1.5}}>Essayez d'élargir votre recherche ou de modifier vos filtres.</p><button className="bs" onClick={()=>{setQ("");setCat("all")}}>Réinitialiser la recherche</button></div>:
      <div className="grid" style={{paddingTop:16}}>{filtered.map(i=><Card key={i.id} item={i} onOpen={openDetail} favs={state.favorites} dispatch={dispatch} onAuthRequired={state.user?null:()=>setShowA("login")} userLocation={filters.userLocation}/>)}</div>}
    </main>}

    {page==="info"&&infoPage&&<InfoPage id={infoPage} setPage={p=>{setInfoPage(null);setPage(p);}}/>}
    {page==="profile"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main"><Profile state={state} dispatch={dispatch} setPage={setPage} setSelected={openDetail} initTab={profTab} onEditItem={(item)=>{setEditItem(item);setPage("create");}}/></div></div>}
    {page==="messages"&&state.user&&<div className="sb-layout sb-layout-h"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main"><Messages state={state} dispatch={dispatch} cid={cid} setCid={setCid} setPage={setPage}/></div></div>}
    {page==="create"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main"><CreateListing state={state} dispatch={dispatch} setPage={(p)=>{setEditItem(null);setPage(p);}} mode={mode} editItem={editItem}/></div></div>}
    {page==="favoris"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main" style={{display:"flex"}}><FavorisPage state={state} dispatch={dispatch} setPage={setPage} setSelected={openDetail}/></div></div>}
    {page==="reservations"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main" style={{display:"flex"}}><ReservationsPage state={state} dispatch={dispatch} setPage={setPage}/></div></div>}
    {page==="avis"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main" style={{display:"flex"}}><AvisPage state={state}/></div></div>}
    {(page==="create"||page==="profile"||page==="messages"||page==="dashboard"||page==="referral"||page==="verify"||page==="dispute"||page==="wallet"||page==="badges"||page==="favoris"||page==="reservations"||page==="avis")&&!state.user&&<div className="empty" style={{paddingTop:100}}><span>🔒</span><h2>Connectez-vous</h2><p>Vous devez être connecté pour accéder à cette page.</p><button className="bp" style={{marginTop:14}} onClick={()=>setShowA("login")}>Se connecter</button></div>}

    {page==="home"&&<footer id="site-footer" style={{background:"#0f0b2b",marginTop:0,paddingBottom:0}}>
      {/* Transition */}
      <div style={{height:40,background:"linear-gradient(to bottom,var(--bg),transparent)",marginBottom:0}}/>
      {/* Cartes promo */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:"0 24px 40px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
          {[{icon:"🎁",title:"Parrainez un ami",sub:"Gagnez 5€ par filleul",cta:"Inviter →",action:()=>{if(state.user)setPage("referral");else setShowA("login")}},{icon:"📊",title:"Dashboard Pro",sub:"Gérez vos locations",cta:"Accéder →",action:()=>{if(state.user)setPage("dashboard");else setShowA("login")}},{icon:"🏅",title:"Programme fidélité",sub:"Réduisez vos commissions",cta:"Voir mon grade →",action:()=>{if(state.user){setProfTab("grade");setPage("profile")}else setShowA("login")}}].map(c=>(
            <div key={c.title} onClick={c.action} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:16,padding:"20px 16px",textAlign:"center",cursor:"pointer",transition:"all .2s"}} onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.1)";e.currentTarget.style.transform="translateY(-3px)"}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.06)";e.currentTarget.style.transform=""}}>
              <div style={{fontSize:28,marginBottom:8}}>{c.icon}</div>
              <div style={{fontWeight:700,fontSize:13,color:"#fff",marginBottom:4}}>{c.title}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.55)",marginBottom:12}}>{c.sub}</div>
              <div style={{display:"inline-block",background:"var(--p)",color:"#fff",borderRadius:100,padding:"5px 14px",fontSize:11,fontWeight:600}}>{c.cta}</div>
            </div>
          ))}
        </div>
      </div>
      {/* Accordéons */}
      <div className="footer-grid" style={{maxWidth:1200,margin:"0 auto",padding:"0 24px"}}>
        {[{key:"assistance",label:"Assistance",links:[{t:"Centre d'aide",a:()=>setShowChat(true)},{t:"Guide de démarrage",a:()=>goInfo("guide")},{t:"Résoudre un litige",a:()=>{if(state.user)setPage("dispute");else setShowA("login")}},{t:"Sécurité paiements",a:()=>goInfo("security")},{t:"Nous contacter",a:()=>goInfo("contact")}]},{key:"communaute",label:"Communauté",links:[{t:"Blog Cercle",a:()=>goInfo("blog")},{t:"Forum d'entraide",a:()=>goInfo("forum")},{t:"Guides pratiques",a:()=>goInfo("guides")},{t:"Parrainage",a:()=>{if(state.user)setPage("referral");else setShowA("login")}},{t:"Impact environnemental",a:()=>goInfo("impact")},{t:"Témoignages",a:()=>goInfo("temoignages")}]},{key:"proprietaire",label:"Propriétaire",links:[{t:"Proposer un objet",a:()=>{if(state.user)setPage("create");else setShowA("login")}},{t:"Tableau de bord",a:()=>{if(state.user)setPage("dashboard");else setShowA("login")}},{t:"Conseils pour louer",a:()=>goInfo("conseils")},{t:"Maximiser ses revenus",a:()=>goInfo("revenus")},{t:"Bonnes photos",a:()=>goInfo("photos")},{t:"Super Proprio",a:()=>goInfo("superproprio")}]},{key:"cercle",label:"Cercle",links:[{t:"À propos",a:()=>goInfo("about")},{t:"Notre mission",a:()=>goInfo("mission")},{t:"Carrières",a:()=>goInfo("careers")},{t:"Espace presse",a:()=>goInfo("press")},{t:"Partenariats",a:()=>goInfo("partners")},{t:"Newsletter",a:()=>goInfo("newsletter")}]}].map(sec=>(
          <div key={sec.key}>
            <div className="footer-sec-hdr" style={{fontWeight:700,fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",color:"rgba(255,255,255,0.6)",marginBottom:14}} onClick={()=>toggleSection(sec.key)}>
              {sec.label}
              <span style={{fontSize:14,opacity:0.7,display:'none'}} className="footer-toggle">{openSection===sec.key?'−':'+'}</span>
            </div>
            <div className={"footer-sec-links"+(openSection===sec.key?" open":"")}>
              {sec.links.map(l=><div key={l.t} onClick={l.a} style={{fontSize:13,color:"rgba(255,255,255,0.85)",padding:"5px 0",cursor:"pointer",transition:"color .15s"}} onMouseEnter={e=>e.currentTarget.style.color="#fff"} onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,0.85)"}>{l.t}</div>)}
            </div>
          </div>
        ))}
      </div>
      {/* Bas de page */}
      <div style={{maxWidth:1200,margin:"32px auto 0",padding:"20px 24px",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:"var(--p)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:16,fontFamily:"var(--fd)"}}>C</div>
          <span style={{fontFamily:"var(--f)",fontSize:20,fontWeight:800,color:"#fff",letterSpacing:"-.02em"}}>Cercle</span>
        </div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          {["Conditions générales","Confidentialité","Mentions légales","Cookies"].map(t=><span key={t} style={{fontSize:13,color:"#8f8ca6",cursor:"pointer"}} onClick={()=>goInfo("guide")}>{t}</span>)}
        </div>
        <span style={{fontSize:12,color:"#666180"}}>© 2026 Cercle</span>
      </div>
      <div style={{height:80}}/>
    </footer>}

    {sel&&<Detail item={sel} onClose={closeDetail} state={state} dispatch={dispatch} setPage={setPage} setConvId={setCid} setShowShop={setShowShop} setProfTab={setProfTab} onAuthRequired={()=>setShowA("login")}/>}
    {showF&&<FilterM onClose={()=>setShowF(false)} filters={filters} setFilters={setFilters} count={filtered.length}/>}
    {showS&&<SearchM onClose={()=>setShowS(false)} onSearch={search} allItems={all} filters={filters} setFilters={setFilters}/>}
    {showA&&<AuthModal onClose={()=>setShowA(null)} dispatch={dispatch} mode={showA}/>}
    {showOnboarding&&<Onboarding onClose={()=>{setShowOnboarding(false);try{localStorage.setItem('cercle_ob','1')}catch{}}}/>}
    <div className="toast-stack">{toasts.map(t=><div key={t.id} className={"t2 t2-"+t.type}><span>{t.type==='s'?"✅":t.type==='b'?"🎉":t.type==='e'?"❌":t.type==='w'?"⭐":"ℹ️"}</span><span>{t.text}</span></div>)}</div>
    {page==="map"&&<MapPage items={filtered} onOpen={openDetail} favs={state.favorites} dispatch={dispatch} mode={mode}/>}
    {page==="notifs"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main"><NotifCenter state={state} dispatch={dispatch} setPage={setPage}/></div></div>}
    {page==="dashboard"&&state.user&&<div className="sb-layout"><Sidebar page={page} setPage={setPage} setProfTab={setProfTab} profTab={profTab} state={state} dispatch={dispatch}/><div className="sb-main"><Dashboard state={state} dispatch={dispatch} setPage={setPage}/></div></div>}
    {page==="gestion"&&state.user&&state.user.isPro&&<GestionPro state={state} dispatch={dispatch} setPage={setPage}/>}
    {page==="gestion"&&state.user&&!state.user.isPro&&<div className="empty" style={{paddingTop:100}}><span>⭐</span><h2>Réservé aux Pro</h2><p>Créez un compte professionnel pour accéder à la Gestion Pro.</p><button className="bp" style={{marginTop:14}} onClick={()=>setShowA("register")}>Passer en Pro</button></div>}
    {page==="referral"&&state.user&&<ReferralPage state={state} dispatch={dispatch} setPage={setPage}/>}
    {page==="verify"&&state.user&&<VerifyId state={state} dispatch={dispatch} setPage={setPage}/>}
    {page==="dispute"&&state.user&&<DisputePage state={state} dispatch={dispatch} setPage={setPage}/>}
    {page==="wallet"&&state.user&&<WalletPage state={state} dispatch={dispatch} setPage={setPage}/>}
    {page==="badges"&&state.user&&<BadgesPage state={state} setPage={setPage}/>}
    {showShop&&<Shop owner={showShop} items={all} onClose={()=>setShowShop(null)} onOpen={i=>{setShowShop(null);openDetail(i);}} state={state} dispatch={dispatch} onAuthRequired={()=>setShowA("login")}/>}
    {showGallery&&<Gallery images={showGallery.imgs} start={showGallery.idx||0} onClose={()=>setShowGallery(null)}/>}
    {/* Chatbot */}
    {showChat?<Chatbot items={all} onOpen={i=>{setShowChat(false);openDetail(i);}} onClose={()=>setShowChat(false)}/>:<button className="chatbot-btn" onClick={()=>setShowChat(true)}>🤖</button>}
    {/* Push notification */}
    {pushNotif&&<div className="push"><span style={{fontSize:16}}>🔔</span><div style={{flex:1,fontSize:12}}><div style={{fontWeight:700}}>Cercle</div>{pushNotif.text}</div><button className="push-close" onClick={()=>setPushNotif(null)}>✕</button></div>}
    {menu&&<div style={{position:"fixed",inset:0,zIndex:99}} onClick={()=>setMenu(false)}/>}
    {/* Bottom Nav Mobile */}
    <nav className="bnav"><div className="bnav-in">
      <button className={"bn"+(page==="home"?" on":"")} onClick={home}><I.Home/><span>Accueil</span></button>
      <button className={"bn"+(page==="map"?" on":"")} onClick={()=>setPage("map")}><I.MapPin/><span>Carte</span></button>
      {state.user&&<button className={"bn"+(page==="messages"?" on":"")} onClick={()=>setPage("messages")}><I.Msg/><span>Messages</span></button>}
      {state.user&&<button className={"bn"+(page==="notifs"?" on":"")} onClick={()=>{setPage("notifs");dispatch({type:"READ_N"})}}><I.Bell/>{unread>0&&<span className="bnd"/>}<span>Notifs</span></button>}
      {state.user?.isPro&&<button className={"bn"+(page==="gestion"?" on":"")} onClick={()=>setPage("gestion")} style={{color:page==="gestion"?"#D97706":undefined}}><span style={{fontSize:18}}>⭐</span><span>Gestion</span></button>}
      <button className={"bn"+((page==="profile"||page==="dashboard")?" on":"")} onClick={()=>state.user?(setProfTab("annonces"),setPage("profile")):setShowA("login")}><I.Prof/><span>Profil</span></button>
    </div></nav>
  </div></Ctx.Provider>
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));


</script>
</body>
</html>

                      <div style={{height:144,position:"relative",background:f.images&&f.images[0]?'var(--bgw)':cardColor,overflow:"hidden",cursor:"pointer"}} onClick={()=>setSelected&&setSelected(f)}>
                        {f.images&&f.images[0]
                          ?<img src={f.images[0]} alt={f.title} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                          :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:40}}>{f.img||"📦"}</div>}
                        <button onClick={e=>{e.stopPropagation();dispatch({type:'TOGGLE_FAVORITE',itemId:f.id});}} style={{position:"absolute",top:8,right:8,width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.92)",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,boxShadow:"0 1px 4px rgba(0,0,0,0.15)"}}>❤️</button>
                      </div>
                      <div style={{padding:"12px 14px"}}>
                        <p style={{fontSize:13,fontWeight:700,color:"var(--dk)",margin:"0 0 2px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.title}</p>
                        <p style={{fontSize:11,color:"var(--g)",margin:"0 0 8px"}}>{CATS_FR&&CATS_FR[f.cat]?CATS_FR[f.cat]:f.cat||"Divers"}</p>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                          <span style={{fontSize:14,fontWeight:800,color:"var(--p)"}}>{f.price}€<span style={{fontWeight:400,fontSize:10,color:"#9ca3af"}}>/j</span></span>
                          <span style={{fontSize:11,color:"var(--g)"}}>⭐ {f.rating||"4.8"}</span>
                        </div>
                        <button onClick={()=>setSelected&&setSelected(f)} style={{width:"100%",padding:"8px 0",borderRadius:10,border:"none",background:"var(--p)",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",transition:"opacity .15s"}} onMouseEnter={e=>e.currentTarget.style.opacity=".85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>Réserver</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>;
        })()}

        {/* ── Grade ── */}
        {tab === 'grade' && (() => {
          const rentals = user.rentals || 0;
          const currentGradeIdx = GRADES.reduce((acc, g, i) => rentals >= g.min ? i : acc, 0);
          const currentGrade = GRADES[currentGradeIdx];
          const nextGrade = GRADES[currentGradeIdx + 1];
          const progressPct = nextGrade ? Math.min(100, Math.round(((rentals - currentGrade.min) / (nextGrade.min - currentGrade.min)) * 100)) : 100;
          const {div} = getDivision(rentals);
          const isFondateur = currentGrade.id === 'fondateur';
          const memberYear = user.createdAt ? new Date(user.createdAt).getFullYear() : 2023;
          const myRevs = (state.reviews||[]).filter(r=>r.targetId===user.id);
          const avgRating = myRevs.length > 0 ? (myRevs.reduce((s,r)=>s+r.rating,0)/myRevs.length).toFixed(1).replace('.',',') : '4,9';
          const mainPerks = currentGrade.avantages || currentGrade.perks || [];
          const PERK_EMOJI = [['Commission','💰'],['Accès','🚀'],['Messagerie','💬'],['Statistiques','📊'],['Assurance','🛡️'],['Badge','⭐'],['Support','🎧'],['Mise en avant','📌'],['Visibilité','👁️'],['Ambassadeur','🏅'],['Parts','📈'],['Trophée','🏆'],['Boost','⚡'],['annonce','🏷️']];
          function perkIcon(p){const e=PERK_EMOJI.find(([k])=>p.toLowerCase().includes(k.toLowerCase()));return e?e[1]:'✨';}
          const mainGrades = GRADES.slice(0,5);
          const fondateur = GRADES[5];
          return (
            <div style={{paddingBottom:40}}>

              {/* Page title */}
              <div style={{marginBottom:24}}>
                <div style={{fontFamily:"var(--fd)",fontSize:26,fontWeight:700,color:"var(--dk)"}}>Mon Grade</div>
                <div style={{fontSize:13,color:"var(--g)",marginTop:4}}>Votre progression et vos avantages exclusifs</div>
              </div>

              {/* Hero gradient banner */}
              <div style={{
                background:isFondateur
                  ?'linear-gradient(135deg,#0a0a0a 0%,#1a1200 60%,#0a0a0a 100%)'
                  :'linear-gradient(12deg,#5c4fe8 35%,#2e1fbd 107%)',
                borderRadius:20,
                marginBottom:24,
                boxShadow:'0 8px 32px rgba(92,79,232,0.4)',
                display:'flex',
                alignItems:'center',
                padding:'0 40px',
                minHeight:180,
                position:'relative',
                overflow:'hidden'
              }}>
                {isFondateur&&<div style={{position:'absolute',inset:0,background:'linear-gradient(105deg,transparent 35%,rgba(212,175,55,0.15) 50%,transparent 65%)',backgroundSize:'200% 100%',animation:'shimmerCard 2.5s linear infinite',pointerEvents:'none'}}/>}
                <span style={{fontSize:48,flexShrink:0,marginRight:24}}>{currentGrade.icon}</span>
                <div>
                  <div style={{fontSize:22,fontWeight:700,color:'#fff',marginBottom:6}}>
                    {isFondateur?currentGrade.name:`${currentGrade.name} · Grade ${div.label}`}
                  </div>
                  <div style={{fontSize:14,color:'rgba(255,255,255,0.7)',marginBottom:8}}>
                    {currentGrade.perks.slice(0,3).join(' · ')}
                  </div>
                  <div style={{fontSize:12,color:'rgba(255,255,255,0.6)'}}>
                    ⭐ {avgRating}  ·  {rentals} location{rentals!==1?'s':''}  ·  Membre depuis {memberYear}
                  </div>
                </div>
              </div>

              {/* Progress bar section */}
              {nextGrade ? (
                <div style={{marginBottom:24}}>
                  <div style={{fontSize:13,fontWeight:700,color:"var(--dk)",marginBottom:14}}>
                    Progression vers {nextGrade.name}
                  </div>
                  <div style={{position:'relative',marginBottom:12}}>
                    <div style={{height:8,background:'#ebe5ff',borderRadius:100,overflow:'visible',position:'relative'}}>
                      <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${progressPct}%`,background:'var(--p)',borderRadius:100,transition:'width 0.8s ease'}}/>
                    </div>
                    <span style={{position:'absolute',left:`${progressPct}%`,top:-20,transform:'translateX(-50%)',fontSize:11,fontWeight:700,color:'var(--p)',whiteSpace:'nowrap'}}>{progressPct}%</span>
                  </div>
                  <div style={{fontSize:11,color:"var(--g)",marginTop:4}}>
                    Il vous faut encore {(nextGrade.min - rentals).toLocaleString()} locations pour atteindre {nextGrade.name}
                  </div>
                </div>
              ) : (
                <div style={{marginBottom:24,background:'linear-gradient(135deg,#0a0a0a,#1a1200)',borderRadius:16,padding:'16px 20px',border:'2px solid #D4AF37'}}>
                  <div style={{fontSize:14,fontWeight:800,background:'linear-gradient(90deg,#FFD700,#FFF8DC,#D4AF37)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>👑 Félicitations, vous êtes au sommet de Cercle !</div>
                </div>
              )}

              {/* Tier cards — 4 main + fondateur */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:12}}>
                {mainGrades.slice(0,4).map((g,gi)=>{
                  const isCurrentGrade = g.id===currentGrade.id;
                  const isUnlocked = rentals>=g.min;
                  return (
                    <div key={g.id} style={{
                      background:isCurrentGrade?'var(--p)':'var(--w)',
                      borderRadius:16,
                      border:'1px solid var(--bd)',
                      boxShadow:isCurrentGrade?'0 8px 24px rgba(92,79,232,0.35)':'0 4px 20px rgba(15,10,71,0.07)',
                      padding:'19px',
                      height:148,
                      position:'relative',
                      overflow:'hidden',
                      opacity:isUnlocked?1:0.55,
                      filter:isUnlocked?'none':'grayscale(0.5)',
                      animation:`scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) ${gi*0.07}s both`
                    }}>
                      {isUnlocked&&!isCurrentGrade&&(
                        <div style={{position:'absolute',top:11,right:11,width:20,height:20,borderRadius:'50%',background:'var(--p)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff',fontWeight:700}}>✓</div>
                      )}
                      <div style={{fontSize:32,marginBottom:12}}>{g.icon}</div>
                      <div style={{fontSize:16,fontWeight:700,color:isCurrentGrade?'#fff':'var(--dk)',marginBottom:4}}>{g.name}</div>
                      <div style={{fontSize:12,fontWeight:500,color:isCurrentGrade?'rgba(255,255,255,0.8)':'var(--tx)',marginBottom:4}}>Commission {Math.round(g.feeRate*100)}%</div>
                      <div style={{fontSize:10,color:isCurrentGrade?'rgba(255,255,255,0.6)':'var(--g)'}}>Grade I–III</div>
                    </div>
                  );
                })}
              </div>

              {/* Legende + Fondateur in a row */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:32}}>

                  const isCurrentGrade = g.id===currentGrade.id;
                  const isUnlocked = rentals>=g.min;
                  const isFond = g.id==='fondateur';
                  return (
                    <div key={g.id} style={{
                      background:isCurrentGrade?(isFond?'linear-gradient(135deg,#0a0a0a,#1a1200)':'var(--p)'):'var(--w)',
                      borderRadius:16,
                      border:isFond?(isCurrentGrade?'1px solid #D4AF37':'1px solid var(--bd)'):'1px solid var(--bd)',
                      boxShadow:isCurrentGrade?(isFond?'0 8px 32px rgba(212,175,55,0.4)':'0 8px 24px rgba(92,79,232,0.35)'):'0 4px 20px rgba(15,10,71,0.07)',
                      padding:'19px',
                      height:148,
                      position:'relative',
                      overflow:'hidden',
                      opacity:isUnlocked?1:0.55,
                      filter:isUnlocked?'none':'grayscale(0.5)',
                      animation:`scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) ${(gi+4)*0.07}s both`
                    }}>
                      {isFond&&isUnlocked&&<div style={{position:'absolute',inset:0,background:'linear-gradient(105deg,transparent 35%,rgba(212,175,55,0.12) 50%,transparent 65%)',backgroundSize:'200% 100%',animation:'shimmerCard 2.5s linear infinite',pointerEvents:'none'}}/>}
                      {isUnlocked&&!isCurrentGrade&&(
                        <div style={{position:'absolute',top:11,right:11,width:20,height:20,borderRadius:'50%',background:isFond?'#D4AF37':'var(--p)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:isFond?'#0a0a0a':'#fff',fontWeight:700}}>✓</div>
                      )}
                      <div style={{fontSize:32,marginBottom:12,position:'relative',zIndex:1}}>{g.icon}</div>
                      <div style={{fontSize:16,fontWeight:700,color:isCurrentGrade?(isFond?'#FFD700':'#fff'):'var(--dk)',marginBottom:4,position:'relative',zIndex:1}}>{g.name}</div>
                      <div style={{fontSize:12,fontWeight:500,color:isCurrentGrade?(isFond?'rgba(255,248,220,0.8)':'rgba(255,255,255,0.8)'):'var(--tx)',marginBottom:4,position:'relative',zIndex:1}}>Commission {Math.round(g.feeRate*100)}%</div>
                      <div style={{fontSize:10,color:isCurrentGrade?(isFond?'rgba(255,248,220,0.6)':'rgba(255,255,255,0.6)'):'var(--g)',position:'relative',zIndex:1}}>Grade I–III</div>
                    </div>
                  );
                })}
              </div>

              {/* Advantages */}
              <div>
                <div style={{fontSize:15,fontWeight:700,color:"var(--dk)",marginBottom:16}}>
                  Mes avantages {currentGrade.name}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
                  {mainPerks.map((perk,pi)=>(
                    <div key={pi} style={{
                      background:'#f7f5ff',
                      border:'1px solid #ece8ff',
                      borderRadius:12,
                      height:60,
                      display:'flex',
                      alignItems:'center',
                      gap:12,
                      padding:'0 16px',
                      overflow:'hidden'
                    }}>
                      <span style={{fontSize:22,flexShrink:0}}>{perkIcon(perk)}</span>
                      <span style={{fontSize:12,fontWeight:500,color:"var(--dk)",lineHeight:1.3}}>{perk}</span>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          );
        })()}

        {/* ── Mon Parc (Pro) ── */}
        {tab === 'parc' && user.isPro && (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
              <div style={{background:'linear-gradient(135deg,#F59E0B,#D97706)',borderRadius:12,padding:'8px 14px',color:'#fff',fontSize:12,fontWeight:700}}>⭐ Parc PRO · {proParc.length} équipements</div>
              <div style={{flex:1}}/>
              <div style={{fontSize:12,color:'rgba(255,255,255,0.7)'}}>
                {proParc.filter(e=>e.status==='available').length} dispo · {proParc.filter(e=>e.status==='rented').length} loués
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {proParc.map((eq,i)=>{
                const statusLabel = eq.status==='available'?'Disponible':eq.status==='rented'?'En location':'Maintenance';
                const statusColor = eq.status==='available'?'#059669':eq.status==='rented'?'#D97706':'#6b7280';
                const statusBg = eq.status==='available'?'#d1fae5':eq.status==='rented'?'#FEF3C7':'#f3f4f6';
                return (
                  <div key={eq.id} style={{background:'rgba(255,255,255,0.95)',borderRadius:16,padding:'14px 16px',display:'flex',gap:14,alignItems:'center',animation:`fadeSlideUp 0.4s ${i*0.06}s both`,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',border:'1px solid rgba(91,79,232,0.08)'}}>
                    <div style={{width:50,height:50,borderRadius:14,background:'linear-gradient(135deg,#FEF3C7,#FDE68A)',fontSize:26,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{eq.icon}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,color:'#111827',marginBottom:3}}>{eq.title}</div>
                      <div style={{fontSize:11,color:'#6b7280'}}>{eq.rentals} locations · {eq.price}€/j</div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:5}}>
                      <span style={{background:statusBg,color:statusColor,borderRadius:20,padding:'4px 10px',fontSize:10,fontWeight:700}}>{statusLabel}</span>
                      <div style={{fontSize:13,fontWeight:800,color:'#D97706'}}>{eq.price}€<span style={{fontWeight:400,fontSize:10,color:'#9ca3af'}}>/j</span></div>
                    </div>
                  </div>
                );
              })}
            </div>

              const pc = state.profileCompletion || {identity:false,phone:false,drivingLicense:false,bankAccount:false};
              const steps = [
                {key:'identity', label:'Identité', icon:'🪪', desc:'Pièce d\'identité officielle'},
                {key:'phone', label:'Téléphone', icon:'📱', desc:'Numéro vérifié par SMS'},
                {key:'drivingLicense', label:'Permis', icon:'🚗', desc:'Requis pour louer'},
                {key:'bankAccount', label:'Bancaire', icon:'🏦', desc:'Pour vos paiements'},
              ];
              const doneCount = steps.filter(s=>pc[s.key]).length;
              const pct = Math.round(doneCount/steps.length*100);
              const circ = 188.5;
              const handleComplete = (key)=>{
                if(key==='phone') setVerifData(p=>({...p,phoneNum:profileData.phone||''}));
                setVerifModal(key);
              };
              return (
                <div style={{background:'var(--w)',borderRadius:20,border:'1px solid var(--bd)',boxShadow:'0 2px 16px rgba(0,0,0,0.06)',padding:'20px',marginBottom:16,animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:'0.04s'}}>
                  <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
                    <div style={{width:38,height:38,borderRadius:12,background:'linear-gradient(135deg,#5b4fe8,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>🧩</div>

                      <div style={{fontSize:15,fontWeight:700,color:'var(--dk)',lineHeight:1.2}}>Complétion du profil</div>
                      <div style={{fontSize:12,color:'var(--g)'}}>Boostez votre visibilité</div>
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:20,marginBottom:20}}>
                    <div style={{position:'relative',flexShrink:0}}>
                      <svg width="76" height="76" viewBox="0 0 76 76">
                        <circle cx="38" cy="38" r="30" fill="none" stroke="#ede9fe" strokeWidth="7"/>
                        <circle cx="38" cy="38" r="30" fill="none" stroke="url(#pgGrad)" strokeWidth="7"
                          strokeLinecap="round"
                          strokeDasharray={`${pct/100*circ} ${circ}`}
                          transform="rotate(-90 38 38)"
                        />
                        <defs>
                          <linearGradient id="pgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor="#5b4fe8"/>
                            <stop offset="100%" stopColor="#a78bfa"/>
                          </linearGradient>
                        </defs>
                      </svg>
                      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
                        <span style={{fontSize:17,fontWeight:800,color:'var(--dk)',lineHeight:1}}>{pct}%</span>
                      </div>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:15,fontWeight:700,color:'var(--dk)',marginBottom:3}}>{pct===100?'Profil complet ✨':'Profil incomplet'}</div>

                      {pct<100&&<div style={{fontSize:12,color:'#5b4fe8',fontWeight:600,background:'#f5f3ff',padding:'5px 10px',borderRadius:8,display:'inline-block'}}>Complétez pour +50% de visibilité</div>}
                    </div>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    {steps.map(step=>(
                      <div key={step.key} onClick={!pc[step.key]?()=>handleComplete(step.key):undefined}

                        <span style={{fontSize:18}}>{pc[step.key]?'✅':step.icon}</span>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,color:pc[step.key]?'#15803d':'var(--dk)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{step.label}</div>
                          <div style={{fontSize:10,color:pc[step.key]?'#22c55e':'var(--g)'}}>{pc[step.key]?'Complété':'Ajouter →'}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* ── Mon profil ── */}
            <div style={{background:'var(--w)',borderRadius:20,border:'1px solid var(--bd)',boxShadow:'0 2px 16px rgba(0,0,0,0.06)',padding:'20px',marginBottom:16,animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:'0.08s'}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
                <div style={{width:38,height:38,borderRadius:12,background:'linear-gradient(135deg,#3b82f6,#5b4fe8)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>👤</div>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:'var(--dk)',lineHeight:1.2}}>Mon profil</div>
                  <div style={{fontSize:12,color:'var(--g)'}}>Informations personnelles</div>
                </div>
              </div>
              {[
                {icon:'✏️',label:'Nom complet',key:'name',type:'text',placeholder:'Votre nom'},
                {icon:'📧',label:'Email',key:'email',type:'email',placeholder:'votre@email.fr'},
                {icon:'📱',label:'Téléphone',key:'phone',type:'tel',placeholder:'+33 6 00 00 00 00'},
              ].map((f,i,arr)=>(
                <div key={f.key} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 0',borderBottom:i<arr.length-1?'1px solid var(--bg)':'none'}}>

                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--gl)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:2}}>{f.label}</div>
                    <input type={f.type} value={profileData[f.key]}
                      onChange={e=>setProfileData({...profileData,[f.key]:e.target.value})}

              <div style={{display:'flex',alignItems:'flex-start',gap:12,padding:'13px 0'}}>
                <span style={{fontSize:19,flexShrink:0,width:26,textAlign:'center',marginTop:2}}>✍️</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--gl)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>Bio</div>
                  <textarea rows={3} value={profileData.bio}

                </div>
              </div>
            </div>

            {/* ── Informations Pro ── */}
            {user.isPro && (

                  <div style={{width:38,height:38,borderRadius:12,background:'linear-gradient(135deg,#F59E0B,#D97706)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>🏢</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:15,fontWeight:700,color:'var(--dk)',lineHeight:1.2}}>Informations Pro</div>
                    <div style={{fontSize:12,color:'var(--g)'}}>Votre compte professionnel</div>
                  </div>
                  <span style={{background:'linear-gradient(135deg,#F59E0B,#D97706)',color:'#fff',fontSize:9,fontWeight:800,padding:'3px 8px',borderRadius:20,letterSpacing:'.04em',flexShrink:0}}>PRO</span>
                </div>
                {[
                  {icon:'🏗️',label:'Entreprise',val:user.company||'—'},
                  {icon:'🔢',label:'N° SIRET',val:user.siret||'—'},
                  {icon:'💶',label:'N° TVA',val:user.tva||'—'},
                  {icon:'📞',label:'Tél. pro',val:user.phone||'—'},
                  {icon:'🌐',label:'Site web',val:user.website||'—'},
                ].map((f,i,arr)=>(
                  <div key={f.label} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',borderBottom:i<arr.length-1?'1px solid var(--bg)':'none'}}>
                    <span style={{fontSize:18,flexShrink:0,width:26,textAlign:'center'}}>{f.icon}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--gl)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:1}}>{f.label}</div>
                      <div style={{fontSize:14,color:'var(--dk)',fontWeight:500}}>{f.val}</div>
                    </div>
                  </div>
                ))}
                <div style={{marginTop:14,padding:'10px 14px',background:'#FFFBEB',borderRadius:12,border:'1px solid #FDE68A',fontSize:12,color:'#92400E',display:'flex',alignItems:'center',gap:8}}>
                  <span>⭐</span> Compte Pro actif — Dashboard, Gestion, Facturation PDF
                </div>
              </div>
            )}

            {/* ── Notifications ── */}
            <div style={{background:'var(--w)',borderRadius:20,border:'1px solid var(--bd)',boxShadow:'0 2px 16px rgba(0,0,0,0.06)',padding:'20px',marginBottom:16,animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:'0.16s'}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
                <div style={{width:38,height:38,borderRadius:12,background:'linear-gradient(135deg,#f59e0b,#ef4444)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>🔔</div>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:'var(--dk)',lineHeight:1.2}}>Notifications</div>
                  <div style={{fontSize:12,color:'var(--g)'}}>Choisissez ce que vous recevez</div>
                </div>
              </div>
              {[
                {key:'notifEmail',icon:'📧',bg:'#FEF9C3',title:'Emails',sub:'Nouvelles réservations et messages'},
                {key:'notifPush',icon:'📲',bg:'#DCFCE7',title:'Notifications push',sub:'Alertes en temps réel sur votre appareil'},
              ].map((f,i,arr)=>(
                <div key={f.key} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:i<arr.length-1?'1px solid var(--bg)':'none'}}>
                  <div style={{width:38,height:38,borderRadius:11,background:f.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>{f.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:600,color:'var(--dk)'}}>{f.title}</div>
                    <div style={{fontSize:12,color:'var(--g)',marginTop:1}}>{f.sub}</div>
                  </div>
                  <div style={S.toggle(profileData[f.key])} onClick={()=>setProfileData({...profileData,[f.key]:!profileData[f.key]})}>
                    <div style={S.toggleKnob(profileData[f.key])}/>
                  </div>
                </div>
              ))}
            </div>

            {/* ── Confiance & Sécurité ── */}
            <div style={{background:'var(--w)',borderRadius:20,border:'1px solid var(--bd)',boxShadow:'0 2px 16px rgba(0,0,0,0.06)',padding:'20px',marginBottom:16,animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:'0.20s'}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
                <div style={{width:38,height:38,borderRadius:12,background:'linear-gradient(135deg,#10b981,#059669)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>🛡️</div>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:'var(--dk)',lineHeight:1.2}}>Confiance &amp; Sécurité</div>
                  <div style={{fontSize:12,color:'var(--g)'}}>Statut de vos vérifications</div>
                </div>
              </div>
              {[
                {icon:'✅',bg:'#d1fae5',label:'Identité vérifiée',value:'Confirmée',color:'#10b981'},
                {icon:'📱',bg:'#dbeafe',label:'Numéro vérifié',value:profileData.phone||'—',color:'#3b82f6'},
                {icon:'📧',bg:'#ede9fe',label:'Email vérifié',value:profileData.email||'—',color:'#5b4fe8'},
              ].map((item,i,arr)=>(
                <div key={item.label} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:i<arr.length-1?'1px solid var(--bg)':'none'}}>
                  <div style={{width:38,height:38,borderRadius:11,background:item.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>{item.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:'var(--dk)'}}>{item.label}</div>
                    <div style={{fontSize:12,color:'var(--g)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.value}</div>
                  </div>
                  <span style={{fontSize:11,fontWeight:700,color:item.color,background:item.bg,padding:'4px 10px',borderRadius:20,flexShrink:0}}>Vérifié ✓</span>
                </div>
              ))}
            </div>

            {/* ── Sauvegarder ── */}
            <button style={{width:'100%',padding:'16px',borderRadius:16,background:'linear-gradient(135deg,#5b4fe8,#8b5cf6)',border:'none',color:'white',fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 20px rgba(91,79,232,0.35)',marginBottom:12,animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:'0.28s'}}
              onClick={()=>dispatch({type:"UPD_PROF",payload:{name:profileData.name,email:profileData.email,bio:profileData.bio,phone:profileData.phone}})}>
              Sauvegarder les modifications
            </button>

            {/* ── Déconnexion ── */}
            <button style={{width:'100%',padding:'14px',borderRadius:16,background:'var(--w)',border:'1.5px solid #fecaca',color:'#ef4444',fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,animation:'fadeSlideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both',animationDelay:'0.32s'}}
              onClick={()=>{dispatch({type:"LOGOUT"});setPage('home');}}>
              🚪 Se déconnecter
            </button>

          </div>
        )}

      </div>

      {/* ── Modals de vérification ── */}
      {verifModal && (
      <div className="bk" onClick={e=>{if(e.target===e.currentTarget)closeVerif();}}>
        <div className="md" style={{width:'92%',maxWidth:440}}>
          <div className="mh">
            <button className="mx" onClick={closeVerif} style={{position:'absolute',left:14}}>←</button>
            <h2 style={{fontSize:16,fontWeight:700}}>
              {verifModal==='identity'&&'Vérification d\'identité'}
              {verifModal==='phone'&&'Vérification du téléphone'}
              {verifModal==='drivingLicense'&&'Permis de conduire'}
              {verifModal==='bankAccount'&&'Compte bancaire'}
            </h2>
          </div>
          <div className="mb">

            {/* ─ Identité ─ */}
            {verifModal==='identity'&&(<div>
              <p style={{fontSize:13,color:'var(--g)',marginBottom:16,lineHeight:1.5}}>Vos informations doivent correspondre exactement à votre pièce d'identité officielle.</p>
              <div className="fg"><label>Prénom</label><input value={verifData.firstName} onChange={e=>vd('firstName',e.target.value)} placeholder="Votre prénom"/></div>
              <div className="fg"><label>Nom de famille</label><input value={verifData.lastName} onChange={e=>vd('lastName',e.target.value)} placeholder="Votre nom"/></div>
              <div className="fg"><label>Type de document</label>
                <select value={verifData.docType} onChange={e=>vd('docType',e.target.value)}>
                  <option value="CNI">Carte nationale d'identité</option>
                  <option value="passeport">Passeport</option>
                  <option value="sejour">Titre de séjour</option>
                </select>
              </div>
              <div className="fg"><label>Numéro du document</label><input value={verifData.docNum} onChange={e=>vd('docNum',e.target.value)} placeholder="Ex : 123456789"/></div>
              <div className="fg"><label>Date d'expiration</label><input type="date" value={verifData.docExp} onChange={e=>vd('docExp',e.target.value)}/></div>
              <div className="fg">
                <label>Photo du document (recto)</label>
                <div style={{border:'2px dashed var(--bd)',borderRadius:14,padding:'24px 16px',textAlign:'center',cursor:'pointer',color:'var(--g)',background:'var(--bg)',fontSize:13}}
                  onClick={()=>document.getElementById('idFileInput').click()}>
                  📎 Cliquez pour joindre une photo
                </div>
                <input id="idFileInput" type="file" accept="image/*,.pdf" style={{display:'none'}} onChange={e=>vd('docFile',e.target.files[0])}/>
                {verifData.docFile&&<p style={{fontSize:12,color:'#10b981',marginTop:6}}>✓ {verifData.docFile.name}</p>}
              </div>
            </div>)}

            {/* ─ Téléphone ─ */}
            {verifModal==='phone'&&(<div>
              <p style={{fontSize:13,color:'var(--g)',marginBottom:16,lineHeight:1.5}}>Entrez votre numéro, nous vous enverrons un code de vérification par SMS.</p>
              <div className="fg"><label>Numéro de téléphone</label><input type="tel" value={verifData.phoneNum} onChange={e=>vd('phoneNum',e.target.value)} placeholder="+33 6 00 00 00 00"/></div>
              {!verifData.smsSent
                ?<button className="bp" style={{width:'100%',marginBottom:8}} onClick={()=>{if(verifData.phoneNum)vd('smsSent',true);}}>Envoyer le code SMS</button>
                :<div>
                  <div style={{padding:'10px 14px',background:'#f0fdf4',borderRadius:12,border:'1px solid #86efac',fontSize:13,color:'#166534',marginBottom:14}}>✓ Code envoyé au {verifData.phoneNum}</div>
                  <div className="fg"><label>Code reçu par SMS</label><input type="number" value={verifData.smsCode} onChange={e=>vd('smsCode',e.target.value)} placeholder="6 chiffres" maxLength={6}/></div>
                </div>
              }
            </div>)}

            {/* ─ Permis ─ */}
            {verifModal==='drivingLicense'&&(<div>
              <p style={{fontSize:13,color:'var(--g)',marginBottom:16,lineHeight:1.5}}>Votre permis est requis pour louer des véhicules et équipements motorisés.</p>
              <div className="fg"><label>Numéro de permis</label><input value={verifData.licNum} onChange={e=>vd('licNum',e.target.value)} placeholder="Ex : 12AB12345"/></div>
              <div className="fg"><label>Date d'obtention</label><input type="date" value={verifData.licDate} onChange={e=>vd('licDate',e.target.value)}/></div>
              <div className="fg"><label>Catégorie principale</label>
                <select value={verifData.licCat} onChange={e=>vd('licCat',e.target.value)}>
                  <option value="B">B — Voiture</option>
                  <option value="A">A — Moto</option>
                  <option value="BE">BE — Voiture + remorque</option>
                  <option value="C">C — Poids lourd</option>
                  <option value="AM">AM — Cyclomoteur</option>
                </select>
              </div>
              <div className="fg">
                <label>Photo du permis (recto)</label>
                <div style={{border:'2px dashed var(--bd)',borderRadius:14,padding:'24px 16px',textAlign:'center',cursor:'pointer',color:'var(--g)',background:'var(--bg)',fontSize:13}}
                  onClick={()=>document.getElementById('licFileInput').click()}>
                  📎 Cliquez pour joindre une photo
                </div>
                <input id="licFileInput" type="file" accept="image/*,.pdf" style={{display:'none'}} onChange={e=>vd('licFile',e.target.files[0])}/>
                {verifData.licFile&&<p style={{fontSize:12,color:'#10b981',marginTop:6}}>✓ {verifData.licFile.name}</p>}
              </div>
            </div>)}

            {/* ─ Compte bancaire ─ */}
            {verifModal==='bankAccount'&&(<div>
              <p style={{fontSize:13,color:'var(--g)',marginBottom:16,lineHeight:1.5}}>Nécessaire pour recevoir vos paiements de locations. Vos données sont chiffrées.</p>
              <div className="fg"><label>Titulaire du compte</label><input value={verifData.bankHolder} onChange={e=>vd('bankHolder',e.target.value)} placeholder="Nom complet du titulaire"/></div>
              <div className="fg"><label>IBAN</label><input value={verifData.iban} onChange={e=>vd('iban',e.target.value.toUpperCase())} placeholder="FR76 XXXX XXXX XXXX XXXX XXXX XXX" style={{letterSpacing:'0.04em'}}/></div>
              <div className="fg"><label>BIC / SWIFT</label><input value={verifData.bic} onChange={e=>vd('bic',e.target.value.toUpperCase())} placeholder="Ex : BNPAFRPPXXX"/></div>
              <div className="fg"><label>Nom de la banque</label><input value={verifData.bankName} onChange={e=>vd('bankName',e.target.value)} placeholder="Ex : BNP Paribas"/></div>
              <div style={{padding:'10px 14px',background:'#f0fdf4',borderRadius:12,border:'1px solid #86efac',fontSize:12,color:'#166534',display:'flex',gap:8,alignItems:'center'}}>
                🔒 Vos informations bancaires sont sécurisées et chiffrées.
              </div>
            </div>)}

          </div>
          <div className="mf">
            <button className="bs" onClick={closeVerif}>Annuler</button>
            <button className="bp"
              disabled={
                (verifModal==='identity'&&(!verifData.firstName||!verifData.lastName||!verifData.docNum))||
                (verifModal==='phone'&&(!verifData.smsSent||!verifData.smsCode))||
                (verifModal==='drivingLicense'&&(!verifData.licNum||!verifData.licDate))||
                (verifModal==='bankAccount'&&(!verifData.bankHolder||!verifData.iban||!verifData.bic))
              }
              onClick={()=>completeVerif(verifModal)}>
              Valider
            </button>
          </div>
        </div>
      </div>
    )}

    </div>
  );
}



/* ====== src/create.jsx ====== */
function CreateListing({state,dispatch,setPage,mode,editItem}){
  const[f,setF]=useState(editItem?{title:editItem.title||"",cat:editItem.cat||"tools",price:editItem.price||"",location:editItem.location||state.user?.location||"Paris 11e",condition:editItem.condition||"Comme neuf",description:editItem.description||"",deposit:editItem.deposit||""}:{title:"",cat:"tools",price:"",location:state.user?.location||"Paris 11e",condition:"Comme neuf",description:"",deposit:""});
  const[photos,setPhotos]=useState(editItem?.images||[]);
  const[drag,setDrag]=useState(false);
  const fileRef=useRef(null);
  const camRef=useRef(null);
  const u=(k,v)=>setF(p=>({...p,[k]:v}));

  const [saving,setSaving]=useState(false);
  const [showSimilar,setShowSimilar]=useState(true);
  const previewRef=useRef(null);
  const bodyRef=useRef(null);
  useEffect(()=>{
    const onScroll=()=>{
      if(!previewRef.current||!bodyRef.current)return;
      const HEADER=80,SUBMIT=72;
      const bodyRect=bodyRef.current.getBoundingClientRect();
      const ph=previewRef.current.offsetHeight;
      const scrolled=Math.max(0,-bodyRect.top+HEADER);
      const maxScroll=Math.max(0,bodyRef.current.offsetHeight-ph-SUBMIT);
      previewRef.current.style.transform=`translateY(${Math.min(scrolled,maxScroll)}px)`;
    };
    window.addEventListener('scroll',onScroll,{passive:true});
    onScroll();
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);

  const allItems = useMemo(()=>{const seen=new Set();return [...(state.items||[]),...(state.proItems||[]),...(state.userItems||[]),...(state.cloudItems||[])].filter(i=>{if(seen.has(i.id))return false;seen.add(i.id);return true;});},[state.items,state.proItems,state.userItems,state.cloudItems]);

  const similar = useMemo(()=>{
    const words=(f.title||'').toLowerCase().split(/\s+/).filter(w=>w.length>2);
    return allItems.filter(i=>{
      if(i.cat!==f.cat)return false;
      if(words.length===0)return true;
      return words.some(w=>i.title.toLowerCase().includes(w));
    }).sort((a,b)=>a.price-b.price).slice(0,6);
  },[f.cat,f.title,allItems]);

  const simPrices=similar.map(i=>+i.price);
  const simMin=simPrices.length?Math.min(...simPrices):0;
  const simMax=simPrices.length?Math.max(...simPrices):0;
  const simAvg=simPrices.length?Math.round(simPrices.reduce((a,b)=>a+b,0)/simPrices.length):0;

  // Compresse une image base64 à max 800px, JPEG 75% (~60-120KB)
  const compressImg=(dataUrl,maxW=800,quality=0.75)=>new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const ratio=Math.min(1,maxW/img.width,maxW/img.height);
      const cnv=document.createElement('canvas');
      cnv.width=Math.round(img.width*ratio);
      cnv.height=Math.round(img.height*ratio);
      cnv.getContext('2d').drawImage(img,0,0,cnv.width,cnv.height);
      resolve(cnv.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });

  const addPhotos=(files)=>{
    const remaining=5-photos.length;
    Array.from(files).slice(0,remaining).forEach(file=>{
      const reader=new FileReader();
      reader.onload=async ev=>{
        const compressed=await compressImg(ev.target.result);
        setPhotos(p=>[...p,compressed]);
      };
      reader.readAsDataURL(file);
    });
  };

  const go=async()=>{
    if(!f.title||!f.price)return;
    setSaving(true);
    // Compresse les photos uploadées (déjà compressées), sinon génère images de catégorie
    const imgs=photos.length>0?photos:[mkImg(f.cat,99,0),mkImg(f.cat,99,1),mkImg(f.cat,99,2)];
    const payload={...f,price:+f.price,deposit:+f.deposit||+f.price*3,photos:imgs,images:imgs,isPro:!!state.user?.isPro};
    // Tester si localStorage peut stocker avant dispatch
    try{
      const testKey='cercle_test_'+Date.now();
      localStorage.setItem(testKey,JSON.stringify(payload));
      localStorage.removeItem(testKey);
    }catch(e){
      // Quota dépassé : compresser encore plus
      const smallImgs=await Promise.all(imgs.map(i=>compressImg(i,400,0.6)));
      payload.images=smallImgs;payload.photos=smallImgs;
    }
    if(editItem){dispatch({type:"EDIT_ITEM",payload:{...payload,id:editItem.id}});}
    else{dispatch({type:"ADD_ITEM",payload});}
    setSaving(false);
    setPage("profile");
  };

  const canSubmit = f.title.trim() && f.price;
  const catImg = useMemo(()=>mkImg(f.cat,99,0),[f.cat]);
  const previewImg = photos[0] || catImg;

  return <div className="cl-page">
    {/* Sticky header */}
    <div className="cl-header">
      <button onClick={()=>setPage("profile")} style={{background:'none',border:'none',padding:'4px',cursor:'pointer',display:'flex',alignItems:'center',color:'var(--dk)',borderRadius:10,flexShrink:0}}><I.Back/></button>
      <div style={{flex:1}}>
        <div style={{fontSize:16,fontWeight:800,fontFamily:'var(--fd)',color:'var(--dk)'}}>{editItem?"Modifier l'annonce":"Nouvelle annonce"}</div>
        <div style={{fontSize:12,color:'var(--g)',marginTop:1}}>{editItem?"Mettez à jour votre annonce":"Proposez votre objet en quelques étapes"}</div>
      </div>
      {saving&&<div style={{fontSize:12,color:'var(--p)',fontWeight:600}}>Enregistrement…</div>}
    </div>

    <div className="cl-body" ref={bodyRef}>
    {/* ── Form (left) ── */}
    <div className="cl-form">
      {/* Section 1: Infos de base */}
      <div className="cl-section">
        <div className="cl-section-title"><span>📝</span> L'essentiel</div>
        <div className="fg2">
          <label>Titre de l'annonce *</label>
          <input value={f.title} onChange={e=>u("title",e.target.value)} placeholder="Ex: Perceuse Bosch Pro 800W"/>
        </div>
        <div className="cl-row">
          <div className="fg2" style={{marginBottom:0}}>
            <label>Catégorie</label>
            <select value={f.cat} onChange={e=>u("cat",e.target.value)}>{CATS.filter(c=>c.id!=="all").map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</select>
          </div>
          <div className="fg2" style={{marginBottom:0}}>
            <label>État</label>
            <select value={f.condition} onChange={e=>u("condition",e.target.value)}><option>Comme neuf</option><option>Très bon état</option><option>Bon état</option></select>
          </div>
        </div>
      </div>

      {/* Section 2: Prix */}
      <div className="cl-section">
        <div className="cl-section-title"><span>💰</span> Prix &amp; caution</div>
        <div className="cl-price-row">
          <div className="fg2" style={{marginBottom:0}}>
            <label>Prix par jour (€) *</label>
            <input type="number" value={f.price} onChange={e=>u("price",e.target.value)} placeholder="15" min="1"/>
          </div>
          <div className="fg2" style={{marginBottom:0}}>
            <label>Caution (€)</label>
            <input type="number" value={f.deposit} onChange={e=>u("deposit",e.target.value)} placeholder="Calculée auto"/>
          </div>
        </div>
        {f.price&&<div style={{marginTop:12,padding:'10px 14px',background:'rgba(91,79,232,.07)',borderRadius:12,fontSize:12,color:'var(--p)',fontWeight:600}}>
          💡 Vos gains estimés : <strong>{Math.round(f.price*0.88)}€/jour</strong> après commission Cercle (12%)
        </div>}
      </div>

      {/* Section 2b: Annonces similaires */}
      {similar.length>0&&(
        <div className="cl-section" style={{background:'linear-gradient(135deg,rgba(91,79,232,0.04),rgba(139,92,246,0.04))',border:'1.5px solid rgba(91,79,232,0.18)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div className="cl-section-title" style={{margin:0}}><span>📊</span> Prix du marché</div>
            <button onClick={()=>setShowSimilar(p=>!p)} style={{background:'none',border:'none',fontSize:12,color:'var(--g)',cursor:'pointer',fontWeight:600}}>{showSimilar?'Masquer':'Afficher'}</button>
          </div>
          {showSimilar&&<>
            {/* Stats */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
              {[{label:'Min',val:simMin,c:'#10b981',bg:'#f0fdf4',bc:'#86efac'},{label:'Moyenne',val:simAvg,c:'#5b4fe8',bg:'rgba(91,79,232,0.08)',bc:'rgba(91,79,232,0.35)'},{label:'Max',val:simMax,c:'#f59e0b',bg:'#fefce8',bc:'#fde68a'}].map(s=>(
                <div key={s.label} onClick={()=>u('price',String(s.val))} style={{textAlign:'center',padding:'12px 8px',background:s.bg,borderRadius:14,border:'1.5px solid '+s.bc,cursor:'pointer',transition:'transform .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.transform='scale(1.04)'} onMouseLeave={e=>e.currentTarget.style.transform=''}>
                  <div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.val}€</div>
                  <div style={{fontSize:10,fontWeight:700,color:s.c,textTransform:'uppercase',letterSpacing:'.04em'}}>{s.label}</div>
                  <div style={{fontSize:9,color:'var(--g)',marginTop:1}}>cliquer pour appliquer</div>
                </div>
              ))}
            </div>
            {/* Comparateur si prix saisi */}
            {f.price&&simAvg>0&&(()=>{
              const ratio=+f.price/simAvg;
              const msg=ratio<0.75?{t:'Très bas · attire plus de locataires',c:'#2563eb',bg:'#dbeafe'}:ratio>1.35?{t:'Élevé · réduire pour plus de réservations',c:'#d97706',bg:'#fef3c7'}:{t:'Dans la fourchette ✓',c:'#059669',bg:'#d1fae5'};
              return <div style={{padding:'9px 14px',background:msg.bg,borderRadius:12,fontSize:12,fontWeight:600,color:msg.c,marginBottom:14,display:'flex',alignItems:'center',gap:6}}>
                <span>Votre prix ({f.price}€/j) ·</span><span>{msg.t}</span>
              </div>;
            })()}
            {/* Liste */}
            <div>{similar.map((item,i)=>(
              <div key={item.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:i<similar.length-1?'1px solid var(--bg)':'none'}}>
                <img src={item.images&&item.images[0]} alt="" style={{width:42,height:42,borderRadius:10,objectFit:'cover',flexShrink:0,background:'var(--bg)'}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--dk)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.title}</div>
                  <div style={{fontSize:11,color:'var(--g)'}}>📍 {item.location} · ⭐ {item.rating||'4.8'}</div>
                </div>
                <div style={{flexShrink:0,textAlign:'right'}}>
                  <div style={{fontSize:15,fontWeight:800,color:'var(--p)'}}>{item.price}€</div>
                  <div style={{fontSize:10,color:'var(--g)'}}>/jour</div>
                </div>
              </div>
            ))}</div>
          </>}
        </div>
      )}

      {/* Section 3: Localisation */}
      <div className="cl-section">
        <div className="cl-section-title"><span>📍</span> Localisation</div>
        <div className="fg2" style={{marginBottom:0}}>
          <label>Ville</label>
          <input value={f.location} onChange={e=>u("location",e.target.value)} placeholder="Paris, Lyon, Bordeaux…"/>
        </div>
      </div>

      {/* Section 4: Description */}
      <div className="cl-section">
        <div className="cl-section-title"><span>📄</span> Description</div>
        <div className="fg2" style={{marginBottom:0}}>
          <label>Décrivez votre objet</label>
          <textarea value={f.description} onChange={e=>u("description",e.target.value)} placeholder="Dimensions, accessoires inclus, conditions d'utilisation…" rows={4}/>
        </div>
        <div style={{fontSize:11,color:'var(--gl)',marginTop:6}}>{(f.description||'').length}/500 caractères</div>
      </div>

      {/* Section 5: Photos */}
      <div className="cl-section">
        <div className="cl-section-title"><span>📸</span> Photos <span style={{fontSize:12,fontWeight:500,textTransform:'none',letterSpacing:0,color:'var(--g)'}}>{photos.length}/5</span></div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{addPhotos(e.target.files);e.target.value=""}}/>
        <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{addPhotos(e.target.files);e.target.value=""}}/>
        <div
          className={"photo-grid"}
          onDrop={e=>{e.preventDefault();setDrag(false);addPhotos(e.dataTransfer.files)}}
          onDragOver={e=>{e.preventDefault();setDrag(true)}}
          onDragLeave={()=>setDrag(false)}
        >
          {photos.map((src,i)=><div key={i} className="photo-cell">
            <img src={src} alt=""/>
            <button className="photo-cell-del" onClick={()=>setPhotos(p=>p.filter((_,j)=>j!==i))}>✕</button>
          </div>)}
          {photos.length<5&&<div className={"photo-cell-add"+(drag?" drag":"")} onClick={()=>fileRef.current&&fileRef.current.click()}>
            <span style={{fontSize:24}}>+</span>
            <span style={{fontSize:11,fontWeight:600}}>{photos.length===0?"Ajouter":"Plus"}</span>
          </div>}
        </div>
        {photos.length===0&&<p style={{fontSize:12,color:'var(--g)',marginTop:10,textAlign:'center'}}>Les annonces avec photos reçoivent 3× plus de demandes</p>}
        <button onClick={e=>{e.stopPropagation();camRef.current&&camRef.current.click()}} style={{marginTop:12,width:'100%',padding:'10px',background:'var(--bg)',border:'1.5px solid var(--bd)',borderRadius:12,fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,color:'var(--dk)'}}>📷 Prendre une photo</button>
      </div>
    </div>{/* /cl-form */}

    {/* ── Preview panel (right / scroll via JS) ── */}
    <div className="cl-preview-panel">
    <div ref={previewRef}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--g)',marginBottom:12}}>Aperçu en direct</div>
      <div className="cl-preview-card">
        <div style={{position:'relative'}}>
          <img className="cl-preview-img" src={previewImg} alt="aperçu"/>
          {f.condition&&<span style={{position:'absolute',bottom:10,right:10,background:'rgba(245,158,11,0.92)',color:'#fff',fontSize:10,fontWeight:700,padding:'3px 9px',borderRadius:8,backdropFilter:'blur(4px)'}}>{f.condition}</span>}
          {state.user?.isPro&&<div style={{position:'absolute',top:10,left:10,background:'linear-gradient(135deg,#F59E0B,#D97706)',color:'#fff',padding:'4px 10px',borderRadius:8,fontSize:9,fontWeight:700,letterSpacing:'.04em'}}>PRO</div>}
        </div>
        <div className="cl-preview-body">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:5}}>
            <span style={{fontSize:14,fontWeight:700,color:f.title?'var(--dk)':'var(--gl)',lineHeight:1.35,flex:1,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{f.title||"Titre de l'annonce"}</span>
            <span style={{display:'flex',alignItems:'center',gap:3,fontSize:12,fontWeight:600,color:'var(--tx)',flexShrink:0}}>⭐ 4,9</span>
          </div>
          <div style={{fontSize:12,color:'var(--g)',marginBottom:8}}>📍 {f.location||'Localisation'}</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:18,fontWeight:800,color:'var(--p)'}}>{f.price?f.price+'€':<span style={{fontSize:14,color:'var(--gl)',fontWeight:400}}>Prix/jour</span>}<span style={{color:'var(--g)',fontSize:12,fontWeight:400}}>{f.price?' / jour':''}</span></span>
            {f.deposit&&<span style={{fontSize:11,color:'var(--g)'}}>Caution {f.deposit}€</span>}
          </div>
        </div>
      </div>
      {f.description&&(
        <div style={{marginTop:12,background:'var(--w)',borderRadius:14,border:'1px solid var(--bd)',padding:'12px 14px'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--g)',marginBottom:6,textTransform:'uppercase',letterSpacing:'.04em'}}>Description</div>
          <div style={{fontSize:12,color:'var(--tx)',lineHeight:1.6,display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{f.description}</div>
        </div>
      )}
      <div style={{marginTop:12,padding:'10px 14px',background:'rgba(91,79,232,.06)',borderRadius:12,fontSize:12,color:'var(--p)',fontWeight:600,textAlign:'center'}}>
        💡 Gains estimés : <strong>{f.price?Math.round(+f.price*0.88)+'€/j':'—'}</strong> après commission
      </div>
    </div>{/* /previewRef */}
    </div>{/* /cl-preview-panel */}
    </div>{/* /cl-body */}

    {/* Sticky CTA */}
    <div className="cl-submit">
      <button className="cl-cta" onClick={go} disabled={saving||!canSubmit}>
        {saving?<><span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>⏳</span> Enregistrement…</>:editItem?<><span>💾</span> Enregistrer les modifications</>:<><span>🚀</span> Publier l'annonce</>}
      </button>
    </div>
  </div>
}



/* ====== src/messages.jsx ====== */
function Messages({state,dispatch,cid,setCid,setPage}){
  const[msg,setMsg]=useState("");
  const[searchQ,setSearchQ]=useState("");
  const ref=useRef(null);
  const inputRef=useRef(null);
  const[typing,setTyping]=useState(false);
  const[showList,setShowList]=useState(!cid);

  const convs=state.conversations.slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  const ac=convs.find(c=>c.id===cid);
  const msgs=state.messages.filter(m=>m.cid===cid).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));

  useEffect(()=>{ref.current&&(ref.current.scrollTop=ref.current.scrollHeight)},[msgs.length,cid]);

  const unreadCount=cv=>{
    const cvMsgs=state.messages.filter(m=>m.cid===cv.id&&m.to===state.user?.id);
    return cvMsgs.length>0?1:0;
  };

  const fmtTime=ts=>{
    if(!ts)return'';
    const d=new Date(ts);const now=new Date();
    const diff=(now-d)/1000;
    if(diff<60)return'maintenant';
    if(diff<3600)return Math.floor(diff/60)+'min';
    if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  };

  const send=()=>{
    if(!msg.trim()||!ac)return;
    const other=ac.parts.find(p=>p!==state.user.id);
    dispatch({type:"MSG",payload:{id:uid(),cid,from:state.user.id,fromName:state.user.name||'',fromAvatar:state.user.avatar||'😊',to:other,toName:ac.otherName||'',toAvatar:ac.otherAvatar||'😊',itemId:ac.itemId||'',itemTitle:ac.itemTitle||'',text:msg.trim(),timestamp:new Date()}});
    setMsg("");
    if(inputRef.current)inputRef.current.focus();
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      const reps=["Bonjour ! Oui c'est disponible 😊","Bien sûr, on s'arrange.","Super, quand voulez-vous le récupérer ?","Envoyez-moi une demande !","Merci pour votre intérêt !"];
      dispatch({type:"MSG",payload:{id:uid(),cid,from:other,to:state.user.id,text:reps[Math.floor(Math.random()*reps.length)],timestamp:new Date()}});
    },1200+Math.random()*2e3);
  };

  const getO=cv=>{
    const oid=cv.parts.find(p=>p!==state.user?.id);
    const demo=USERS.find(u=>u.id===oid);if(demo)return demo;
    const msgFrom=state.messages.find(m=>m.cid===cv.id&&m.from!==state.user?.id);
    const n=cv.otherName||msgFrom?.fromName||'Utilisateur';
    const av=cv.otherAvatar||msgFrom?.fromAvatar||'😊';
    return{name:n,avatar:av};
  };

  const openConv=id=>{setCid(id);setShowList(false);};
  const backToList=()=>{setCid(null);setShowList(true);};

  const o=ac?getO(ac):null;

  return <div className="msg-page">
    {/* Header */}
    <div className="msg-header">
      {ac&&<button className="chat-back-btn" onClick={backToList}><I.Back/></button>}
      {!ac&&<button onClick={()=>setPage("home")} style={{background:'none',border:'none',padding:'4px',cursor:'pointer',display:'flex',alignItems:'center',color:'var(--dk)',borderRadius:10}}><I.Back/></button>}
      <div style={{flex:1}}>
        <div style={{fontSize:17,fontWeight:800,fontFamily:'var(--fd)',color:'var(--dk)'}}>{ac?o.name:'Messages'}</div>
        {ac&&<div style={{fontSize:12,color:'#22c55e',fontWeight:600}}>● En ligne</div>}
        {!ac&&<div style={{fontSize:12,color:'var(--g)'}}>{convs.length} conversation{convs.length!==1?'s':''}</div>}
      </div>
      {ac&&<div style={{width:38,height:38,borderRadius:'50%',background:'linear-gradient(135deg,#e0dbff,#c7f0ee)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{o.avatar}</div>}
    </div>

    {/* Body */}
    <div className="msg-body">
      {/* Conversation list */}
      <div className={"conv-list"+((!showList&&ac)?" hidden":"")}>
        <div className="conv-search">
          <input placeholder="🔍  Rechercher une conversation…" value={searchQ} onChange={e=>setSearchQ(e.target.value)}/>
        </div>
        <div className="conv-items">
          {convs.length===0&&<div className="conv-empty"><div><div style={{fontSize:42,marginBottom:12}}>💬</div><div style={{fontWeight:600,color:'var(--dk)',marginBottom:6}}>Aucune conversation</div><div style={{fontSize:13}}>Contactez un propriétaire pour commencer</div></div></div>}
          {convs.length>0&&searchQ&&convs.filter(c=>{const o2=getO(c);return o2.name.toLowerCase().includes(searchQ.toLowerCase())||(c.itemTitle||'').toLowerCase().includes(searchQ.toLowerCase());}).length===0&&<div className="conv-empty"><div><div style={{fontSize:36,marginBottom:10}}>🔍</div><div style={{fontWeight:600,color:'var(--dk)',marginBottom:4}}>Aucun résultat</div><div style={{fontSize:12,color:'var(--g)'}}>Aucune conversation avec "{searchQ}"</div></div></div>}
          {(searchQ?convs.filter(c=>{const o2=getO(c);return o2.name.toLowerCase().includes(searchQ.toLowerCase())||(c.itemTitle||'').toLowerCase().includes(searchQ.toLowerCase());}):convs).map(c=>{
            const o2=getO(c);
            const ub=unreadCount(c);
            const isActive=cid===c.id;
            return <div key={c.id} className={"conv-item"+(isActive?" active":"")} onClick={()=>openConv(c.id)}>
              <div className="conv-av">

            {msgs.map((m,idx)=>{
              const isMe=m.from===state.user?.id;
              const showTime=idx===0||idx===msgs.length-1||(new Date(msgs[idx].timestamp)-new Date(msgs[idx-1]?.timestamp))>300000;
              return <React.Fragment key={m.id}>
                {showTime&&<div className="msg-day-sep"><span>{fmtTime(m.timestamp)}</span></div>}
                <div className={"msg-bubble"+(isMe?" me":" them")}>
                  {m.text}
                  {isMe&&<span className="msg-time">✓✓</span>}
                  {!isMe&&<span className={"msg-time left"}>{new Date(m.timestamp).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>}
                </div>
              </React.Fragment>;
            })}
            {typing&&<div className="chat-typing">
              <div className="chat-typing-av">{o.avatar}</div>
              <div className="chat-typing-dots"><span/><span/><span/></div>
            </div>}
          </div>

          {/* Input */}
          <div className="chat-input-area">
            <textarea
              ref={inputRef}
              className="chat-input"
              value={msg}
              onChange={e=>setMsg(e.target.value)}
              placeholder="Écrire un message…"
              rows={1}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
            />
            <button className="chat-send" onClick={send} disabled={!msg.trim()}><I.Send/></button>
          </div>
        </>}
      </div>
    </div>
  </div>;
}

function MapPage({items,onOpen}){
  const[mapCat,setMapCat]=useState('all');
  const[areaItems,setAreaItems]=useState([]);
  const[drawerOpen,setDrawerOpen]=useState(false);
  const[sel,setSel]=useState(null);
  const mapRef=useRef(null);
  const leafRef=useRef(null);
  const mgRef=useRef(null);
  const rebuildRef=useRef(null);
  const mapCatRef=useRef('all');
  const itemsRef=useRef(items);
  // Always keep itemsRef in sync without triggering effects
  itemsRef.current=items;

  /* ---- helpers ---- */
  const filterByBounds=(map,src)=>{
    try{
      const b=map.getBounds();
      if(!b||!b.isValid())return src;
      return src.filter(i=>typeof i.lat==='number'&&typeof i.lng==='number'&&b.contains([i.lat,i.lng]));
    }catch{return src;}
  };

  const buildMarkers=(map,mg,src)=>{
    mg.clearLayers();
    const cities={};
    src.forEach(i=>{
      if(typeof i.lat!=='number'||typeof i.lng!=='number')return;
      if(!cities[i.location])cities[i.location]={cnt:0,lat:i.lat,lng:i.lng,minPrice:i.price};
      cities[i.location].cnt++;
      if(i.price<cities[i.location].minPrice)cities[i.location].minPrice=i.price;
    });
    Object.entries(cities).forEach(([name,d])=>{
      const short=name.replace(/\s\d+\w?$/,'');
      const icon=window.L.divIcon({
        className:'',
        html:`<div class="map-pin">📍 ${d.cnt} · ${short}</div>`,
        iconSize:[0,0],iconAnchor:[0,16]
      });
      const popup=window.L.popup({maxWidth:200,closeButton:true,className:'map-popup-wrap'}).setContent(
        `<div style="font-family:'DM Sans',system-ui;padding:6px 2px;min-width:140px">
          <div style="font-size:14px;font-weight:700;margin-bottom:4px">📍 ${short}</div>
          <div style="font-size:12px;color:#6B7280">${d.cnt} annonce${d.cnt>1?'s':''} disponible${d.cnt>1?'s':''}</div>
          <div style="font-size:13px;font-weight:600;color:#0D9488;margin-top:4px">À partir de ${d.minPrice}€<span style="font-weight:400;color:#9CA3AF">/jour</span></div>
        </div>`
      );
      const m=window.L.marker([d.lat,d.lng],{icon}).bindPopup(popup);
      m.on('click',()=>{
        setSel(name);
        setDrawerOpen(true);
      });
      mg.addLayer(m);
    });
  };

  /* ---- Init Leaflet (once on mount) ---- */
  useEffect(()=>{
    if(!window.L)return console.warn('[MapPage] Leaflet not loaded');
    if(!mapRef.current)return;
    if(leafRef.current)return;

    const map=window.L.map(mapRef.current,{zoomControl:true,attributionControl:true}).setView([46.8,2.5],6);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© <a href="https://openstreetmap.org/copyright">OSM</a>',
      maxZoom:19
    }).addTo(map);
    const mg=window.L.layerGroup().addTo(map);
    mgRef.current=mg;
    leafRef.current=map;

    // Capture stable refs for event handlers (avoid stale closures)
    rebuildRef.current=(src)=>buildMarkers(map,mg,src);

    const getSrc=()=>{
      const cat=mapCatRef.current;
      return cat==='all'?itemsRef.current:itemsRef.current.filter(i=>i.cat===cat);
    };

    // Initial render — delay filter until map tiles settle
    const initSrc=getSrc();
    buildMarkers(map,mg,initSrc);
    setTimeout(()=>{
      map.invalidateSize();
      setAreaItems(filterByBounds(map,initSrc));
    },200);

    // Both moveend and zoomend → instant list update + reset city selection
    // Note: Leaflet always fires moveend AFTER zoomend, so using both is intentional.
    // zoomend fires first (rebuilds markers+filters), then moveend fires again
    // with the same data — a no-op in practice since getSrc() and bounds are stable.
    // Close popup at zoom START (before animation) so it never survives the transition
    map.on('zoomstart',()=>map.closePopup());

    const onMapChange=()=>{
      map.closePopup();          // belt-and-suspenders: also close on zoomend/moveend
      map.invalidateSize();      // fix grey tiles when container size is recalculated
      const s=getSrc();
      buildMarkers(map,mg,s);
      setAreaItems(filterByBounds(map,s));
      setSel(null);
    };
    map.on('moveend',onMapChange);
    map.on('zoomend',onMapChange);

    return()=>{
      map.remove();
      leafRef.current=null;
      mgRef.current=null;
      rebuildRef.current=null;
    };
  },[]);/* eslint-disable-line react-hooks/exhaustive-deps */

  /* ---- React to category filter changes ---- */
  useEffect(()=>{
    mapCatRef.current=mapCat;
    if(!leafRef.current||!rebuildRef.current)return;
    const src=mapCat==='all'?items:items.filter(i=>i.cat===mapCat);
    rebuildRef.current(src);
    setAreaItems(filterByBounds(leafRef.current,src));
    setSel(null);
    setDrawerOpen(false);
  },[mapCat]);/* eslint-disable-line react-hooks/exhaustive-deps */

  const panelItems=sel?areaItems.filter(i=>i.location===sel):areaItems;
  const closeDrawer=()=>{setSel(null);setDrawerOpen(false);};

  return <div className="map-w">
    {/* Category filter bar */}
    <div className="map-filters">
      {CATS.slice(0,10).map(c=><button key={c.id} className={"pill"+(mapCat===c.id?" on":"")} style={{fontSize:11,whiteSpace:"nowrap",flexShrink:0}} onClick={()=>setMapCat(c.id)}>{c.icon} {c.label}</button>)}
    </div>
    <div className="map-layout">
      {/* Map area */}
      <div style={{position:"relative",minHeight:0}}>
        <div ref={mapRef} style={{position:"absolute",inset:0}}/>
        <button className="map-list-btn" style={{zIndex:1000}} onClick={()=>setDrawerOpen(d=>!d)}>
          📋 {areaItems.length} annonce{areaItems.length!==1?"s":""}
        </button>
      </div>
      {/* Side panel (desktop) / Bottom drawer (mobile) */}
      <div className={"map-side"+(drawerOpen?" open":"")}>
        <div className="map-drawer-handle" onClick={closeDrawer}/>
        <div className="map-side-hd">
          <span>{areaItems.length} annonce{areaItems.length!==1?"s":""} dans cette zone</span>
          <button className="map-drawer-close" onClick={closeDrawer}>✕</button>
        </div>
        {/* Breadcrumb ville sélectionnée */}
        {sel&&<div className="map-breadcrumb">
          <span className="map-breadcrumb-label">📍 {sel} · {panelItems.length} annonce{panelItems.length!==1?"s":""}</span>
          <button className="map-breadcrumb-reset" onClick={()=>setSel(null)}>✕ Tout voir</button>
        </div>}
        {panelItems.length===0
          ?<div style={{padding:32,textAlign:"center",color:"var(--g)"}}><div style={{fontSize:32}}>🗺️</div><p style={{fontSize:12,marginTop:8}}>Aucune annonce dans cette zone</p></div>
          :<div style={{overflowY:"auto",flex:1,paddingBottom:8}}>
            {panelItems.map(i=><div key={i.id} className="map-card" onClick={()=>onOpen(i)}>
              <img src={i.images[0]} alt={i.title}/>
              <div className="map-card-body">
                <div className="map-card-title">{i.title}</div>
                <div className="map-card-meta">📍 {i.location.replace(/\s\d+\w?$/,'')} · ★ {i.rating} ({i.reviews})</div>
                <div style={{display:"flex",alignItems:"baseline",gap:4,marginTop:2}}>
                  <span className="map-card-price">{i.price}€<span>/jour</span></span>
                  {i.condition&&<span style={{fontSize:10,background:"var(--bgw)",border:"1px solid var(--bd)",borderRadius:4,padding:"1px 5px",color:"var(--g)",fontWeight:500}}>{i.condition}</span>}
                </div>
              </div>
            </div>)}
          </div>}
      </div>
    </div>
  </div>;
}

                return`<div style="padding:14px 8px 12px;text-align:center;border-right:${i%6===5?"none":"1px solid #f3f4f6"};border-bottom:${i<6?"1px solid #f3f4f6":"none"};background:${isCur?"#f5f3ff":"#ffffff"};">
                  <div style="font-size:9px;font-weight:${isCur?700:500};color:${isCur?"#5b4fe8":"#9ca3af"};margin-bottom:6px;">${months[i]}</div>
                  <div style="height:48px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px;">
                    <div style="width:20px;height:${barH}px;background:${isCur?"#5b4fe8":v>0?"rgba(91,79,232,0.35)":"rgba(91,79,232,0.1)"};border-radius:4px 4px 0 0;"></div>
                  </div>
                  <div style="font-size:11px;font-weight:${isCur?700:600};color:${isCur?"#5b4fe8":"#374151"};">${v}€</div>
                </div>`;
              }).join("")}
            </div>
            <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:#f3f0ff;border-top:2px solid #e0d9ff;">
              <div style="grid-column:1/5;padding:10px 16px;font-size:11px;font-weight:700;color:#5b4fe8;">Total annuel</div>
              <div style="grid-column:5/7;padding:10px 16px;text-align:right;font-size:13px;font-weight:800;color:#5b4fe8;">${totalAnnuel}€</div>
            </div>
          </div>
        </div>
        <!-- Footer -->
        <div style="padding:0 40px 32px;text-align:center;">
          <div style="border-top:1px solid #f3f4f6;padding-top:18px;font-size:10px;color:#d1d5db;letter-spacing:0.5px;">
            Généré le ${now} &nbsp;•&nbsp; Cercle — Location entre voisins
          </div>
        </div>
      </div>`;
    document.body.appendChild(wrapper);
    try{
      const canvas=await window.html2canvas(wrapper.firstElementChild,{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false});
      const{jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:"portrait",unit:"px",format:"a4",hotfixes:["px_scaling"]});
      const pageW=doc.internal.pageSize.getWidth();
      const pageH=doc.internal.pageSize.getHeight();
      const imgW=pageW;
      const imgH=(canvas.height*pageW)/canvas.width;
      let y=0;
      if(imgH<=pageH){
        doc.addImage(canvas.toDataURL("image/png"),"PNG",0,0,imgW,imgH);
      }else{
        // multi-page if content is taller than one page
        let remaining=imgH;
        while(remaining>0){
          const sliceH=Math.min(remaining,pageH);
          const sliceCanvas=document.createElement("canvas");
          sliceCanvas.width=canvas.width;
          sliceCanvas.height=Math.round(sliceH*(canvas.height/imgH));
          const ctx=sliceCanvas.getContext("2d");
          ctx.drawImage(canvas,0,-Math.round(y*(canvas.height/imgH)));
          doc.addImage(sliceCanvas.toDataURL("image/png"),"PNG",0,0,imgW,sliceH);
          remaining-=sliceH;y+=sliceH;
          if(remaining>0)doc.addPage();
        }
      }
      doc.save(`cercle-dashboard-${now.replace(/\//g,"-")}.pdf`);
    }catch(e){
      console.error("PDF export error:",e);
      console.error("Erreur lors de l'export PDF.", e);
    }finally{
      document.body.removeChild(wrapper);
    }

        {label:"Revenus totaux",val:revenue+"€",trend:`+${monthlyVals[curMonth]}€ ce mois`,accent:"var(--p)"},
        {label:"Note moyenne",val:myItems.length>0&&myItems.some(i=>i.rating>0)?(myItems.reduce((s,i)=>s+i.rating,0)/myItems.length).toFixed(1)+"★":"—",trend:"Excellente réputation",accent:"#F59E0B"},
        {label:"Vues profil",val:(Math.floor((myItems.length||1)*47)).toLocaleString("fr-FR"),trend:"+12% vs. mois dernier",accent:"var(--p)"},
      ].map((k,i)=>(

    {/* ── Pro banner (si Pro) ── */}

/* ===== DISPUTE ===== */
function DisputePage({state,dispatch,setPage}){
  const[reason,setReason]=useState("");const[bookId,setBookId]=useState("");const[desc,setDesc]=useState("");
  const myBook=state.bookings.filter(b=>b.userId===state.user?.id||b.ownerId===state.user?.id);
  const submit=()=>{if(!reason||!bookId)return;dispatch({type:"DISPUTE",payload:{id:uid(),bookingId:bookId,reason,desc,status:"open",by:state.user.id,date:new Date()}});setReason("");setDesc("")};
  return <div style={{maxWidth:540,margin:"0 auto",padding:28}}>
    <button className="cl" style={{marginBottom:14,display:"flex",alignItems:"center",gap:5}} onClick={()=>setPage("profile")}><I.Back/> Retour</button>
    <h1 style={{fontFamily:"var(--fd)",fontSize:22,marginBottom:6}}>⚖️ Litiges</h1>
    <p style={{fontSize:13,color:"var(--g)",marginBottom:16}}>Ouvrez un litige si un problème survient lors d'une location.</p>
    <div className="fg"><label>Réservation concernée</label><select value={bookId} onChange={e=>setBookId(e.target.value)} style={{width:"100%",padding:"10px 12px",border:"1.5px solid var(--bd)",borderRadius:9,fontSize:13}}><option value="">Sélectionner...</option>{myBook.map(b=><option key={b.id} value={b.id}>{b.itemTitle} ({b.startDate})</option>)}</select></div>
    <div className="fg"><label>Motif</label><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{["Objet endommagé","Non conforme","Non restitué","Caution injustifiée","Autre"].map(r=><button key={r} className={"pill"+(reason===r?" on":"")} onClick={()=>setReason(r)}>{r}</button>)}</div></div>
    <div className="fg"><label>Description</label><textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Décrivez le problème..." rows={3}/></div>
    <button className="bp" style={{width:"100%"}} onClick={submit}>Ouvrir le litige</button>
    {state.disputes.length>0&&<><h3 style={{fontFamily:"var(--fd)",fontSize:15,marginTop:20,marginBottom:8}}>Mes litiges</h3>
    {state.disputes.map(d=><div key={d.id} style={{padding:12,border:"1.5px solid var(--bd)",borderRadius:10,marginBottom:8}}>
